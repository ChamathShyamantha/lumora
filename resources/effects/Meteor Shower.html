<head>
  <title>Meteor Shower</title>
  <meta description="Shooting stars streak across your setup trailing long glowing tails." />
  <meta publisher="Lumora" />
  <meta category="Space" />
  <meta energy="lively" />
  <meta palette="cool" />
  <meta tags="space,night,motion" />
  <meta property="direction" label="Direction" type="combobox" values="Down Right,Down Left,Down,Left,Right" default="Down Right" />
  <meta property="count" label="Meteor Count" type="number" min="1" max="30" default="8" />
  <meta property="speed" label="Speed" type="number" min="1" max="100" default="50" />
  <meta property="rainbow" label="Rainbow" type="boolean" default="0" />
  <meta property="color" label="Color" type="color" default="#7fd8ff" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const bool = (v, d) => (v === undefined || v === null ? d : v === true || v === 1 || v === '1' || v === 'true');
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const hexRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    function hsv(h, s, v) {
      h = (h - Math.floor(h)) * 6;
      const i = h | 0, f = h - i, p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
      switch (i) {
        case 0: return [v, t, p];
        case 1: return [q, v, p];
        case 2: return [p, v, t];
        case 3: return [p, q, v];
        case 4: return [t, p, v];
        default: return [v, p, q];
      }
    }
    const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + clamp(a, 0, 1).toFixed(3) + ')';

    const DIRS = {
      'Down Right': [0.83, 0.56],
      'Down Left': [-0.83, 0.56],
      'Down': [0, 1],
      'Left': [-1, 0],
      'Right': [1, 0]
    };
    const cfg = { dir: 'Down Right', count: 8, speed: 50, rainbow: false, rgb: [127, 216, 255] };
    const meteors = [];
    let currentDir = null;

    function readProps() {
      cfg.dir = DIRS[String(get(() => direction, 'Down Right'))] ? String(get(() => direction, 'Down Right')) : 'Down Right';
      cfg.count = Math.round(clamp(num(get(() => count), 8), 1, 30));
      cfg.speed = clamp(num(get(() => speed), 50), 0, 100);
      cfg.rainbow = bool(get(() => rainbow), false);
      cfg.rgb = hexRgb(get(() => color, '#7fd8ff'), '#7fd8ff');
    }
    function ondirectionChanged() { readProps(); }
    function oncountChanged() { readProps(); }
    function onspeedChanged() { readProps(); }
    function onrainbowChanged() { readProps(); }
    function oncolorChanged() { readProps(); }

    function spawn(m, initial) {
      const d = DIRS[cfg.dir];
      const px = Math.random() * W, py = Math.random() * H;
      const back = initial ? 60 + Math.random() * 420 : 220 + Math.random() * 320;
      m.x = px - d[0] * back;
      m.y = py - d[1] * back;
      m.len = 60 + Math.random() * 90;
      m.w = 5 + Math.random() * 5;
      m.v = 0.7 + Math.random() * 0.6;
      m.hue = Math.random();
      return m;
    }

    function update(dt) {
      if (currentDir !== cfg.dir) {
        currentDir = cfg.dir;
        for (const m of meteors) spawn(m, true);
      }
      while (meteors.length < cfg.count) meteors.push(spawn({}, true));
      if (meteors.length > cfg.count) meteors.length = cfg.count;
      const d = DIRS[cfg.dir];
      const base = 80 + cfg.speed * 4;
      for (const m of meteors) {
        m.x += d[0] * base * m.v * dt;
        m.y += d[1] * base * m.v * dt;
        const ahead = (m.x - 160) * d[0] + (m.y - 100) * d[1];
        if (ahead > 200 + m.len) spawn(m, false);
      }
    }

    function render() {
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      const d = DIRS[cfg.dir];
      for (const m of meteors) {
        let c;
        if (cfg.rainbow) { const h = hsv(m.hue, 0.9, 1); c = [h[0] * 255, h[1] * 255, h[2] * 255]; }
        else c = cfg.rgb;
        const hx = m.x, hy = m.y, tx = hx - d[0] * m.len, ty = hy - d[1] * m.len;
        // wide faint halo
        const g1 = ctx.createLinearGradient(hx, hy, tx, ty);
        g1.addColorStop(0, rgba(c, 0.3));
        g1.addColorStop(1, rgba(c, 0));
        ctx.strokeStyle = g1;
        ctx.lineWidth = m.w * 2.6;
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
        // bright core
        const g2 = ctx.createLinearGradient(hx, hy, tx, ty);
        g2.addColorStop(0, rgba(c, 1));
        g2.addColorStop(0.35, rgba(c, 0.6));
        g2.addColorStop(1, rgba(c, 0));
        ctx.strokeStyle = g2;
        ctx.lineWidth = m.w;
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
        // glowing head
        const r = m.w * 2.4;
        const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, r);
        hg.addColorStop(0, 'rgba(255,255,255,0.9)');
        hg.addColorStop(0.35, rgba(c, 0.75));
        hg.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = hg;
        ctx.fillRect(hx - r, hy - r, r * 2, r * 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
