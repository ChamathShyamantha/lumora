<head>
  <title>Pong Rally</title>
  <meta description="Two tireless paddles trade a glowing ball that streaks faster with every hit until someone finally misses." />
  <meta publisher="Lumora" />
  <meta category="Retro & Gaming" />
  <meta energy="lively" />
  <meta palette="mono" />
  <meta tags="pong,tennis,paddle,arcade,classic,ball,game,ai,retro,70s" />
  <meta property="ballColor" label="Ball Color" type="color" default="#ffffff" />
  <meta property="paddleColor" label="Paddle Color" type="color" default="#b4c8ff" />
  <meta property="speed" label="Speed" type="number" min="1" max="100" default="50" />
  <meta property="trail" label="Trail Length" type="number" min="0" max="100" default="60" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const hexRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const rgba = (c, a) => 'rgba(' + (clamp(c[0], 0, 255) | 0) + ',' + (clamp(c[1], 0, 255) | 0) + ',' + (clamp(c[2], 0, 255) | 0) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    const floorBright = (c, m) => { const mx = Math.max(c[0], c[1], c[2]); return mx >= m ? c : mx === 0 ? [m, m, m] : c.map((v) => v * m / mx); };
    const rand = (a, b) => a + Math.random() * (b - a);

    const cfg = { ball: [255, 255, 255], pad: [180, 200, 255], speed: 50, trail: 60 };
    function readProps() {
      cfg.ball = floorBright(hexRgb(get(() => ballColor, '#ffffff'), '#ffffff'), 120);
      cfg.pad = floorBright(hexRgb(get(() => paddleColor, '#b4c8ff'), '#b4c8ff'), 120);
      cfg.speed = clamp(num(get(() => speed), 50), 0, 100);
      cfg.trail = clamp(num(get(() => trail), 60), 0, 100);
    }
    function onballColorChanged() { readProps(); }
    function onpaddleColorChanged() { readProps(); }
    function onspeedChanged() { readProps(); }
    function ontrailChanged() { readProps(); }

    // blocky 3x5 digits (drawn huge and dim in the background)
    const DIG = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001', '111100111001111', '111100111101111', '111001010010010', '111101111101111', '111101111001111'];
    const PW = 10, PH = 56, BS = 14, LX = 8, RX = W - 8 - PW;
    const G = {
      bx: 160, by: 100, vx: 0, vy: 0, v: 1, hits: 0, serve: 1.0,
      pl: { y: 100, target: 100, err: 0, aim: 0 }, pr: { y: 100, target: 100, err: 0, aim: 0 },
      score: [0, 0], flash: [0, 0], hitGlow: [0, 0], trail: [], points: 0, matchFlash: 0
    };

    function serve(dir) {
      G.bx = 160; G.by = rand(60, 140); G.v = 1; G.hits = 0;
      const a = rand(-0.5, 0.5);
      G.vx = dir * Math.cos(a); G.vy = Math.sin(a);
      G.trail.length = 0;
      planAI(dir > 0 ? G.pr : G.pl);
    }

    // predict where the ball will cross the paddle's x, folding wall bounces
    function predict(xTarget) {
      if (G.vx === 0) return G.by;
      const t = (xTarget - G.bx) / G.vx;
      let y = G.by + G.vy * t;
      const lo = BS / 2, hi = H - BS / 2, span = hi - lo;
      y -= lo;
      y = ((y % (2 * span)) + 2 * span) % (2 * span);
      if (y > span) y = 2 * span - y;
      return y + lo;
    }
    function planAI(p) {
      // faster balls and long rallies make mistakes more likely
      const pressure = (G.v - 1) * 0.9 + Math.max(0, G.hits - 14) * 0.12;
      const miss = Math.random() < clamp(0.04 + pressure * 0.22, 0, 0.9);
      p.err = miss ? (Math.random() < 0.5 ? -1 : 1) * rand(PH * 0.55, PH * 0.9) : rand(-PH * 0.3, PH * 0.3);
    }

    function step(dt) {
      const base = 120 + cfg.speed * 2.4; // px/s
      for (let i = 0; i < 2; i++) { G.flash[i] = Math.max(0, G.flash[i] - dt * 1.6); G.hitGlow[i] = Math.max(0, G.hitGlow[i] - dt * 4); }
      G.matchFlash = Math.max(0, G.matchFlash - dt * 0.8);

      if (G.serve > 0) {
        G.serve -= dt;
        if (G.serve <= 0) serve(Math.random() < 0.5 ? -1 : 1);
      } else {
        const sp = base * G.v;
        G.bx += G.vx * sp * dt;
        G.by += G.vy * sp * dt;
        if (G.by < BS / 2) { G.by = BS - G.by; G.vy = Math.abs(G.vy); }
        if (G.by > H - BS / 2) { G.by = 2 * (H - BS / 2) - G.by; G.vy = -Math.abs(G.vy); }
        // paddle hits
        const hit = (p, px, side) => {
          if (Math.abs(G.by - p.y) > PH / 2 + BS / 2) return false;
          const off = clamp((G.by - p.y) / (PH / 2 + BS / 2), -1, 1);
          const ang = off * 0.95 + rand(-0.08, 0.08);
          G.vx = side * Math.cos(ang); G.vy = Math.sin(ang);
          G.v = Math.min(G.v * 1.07, 2.8);
          G.hits++;
          G.hitGlow[side > 0 ? 0 : 1] = 1;
          G.bx = px;
          planAI(side > 0 ? G.pr : G.pl);
          return true;
        };
        if (G.vx < 0 && G.bx - BS / 2 <= LX + PW && G.bx > LX) hit(G.pl, LX + PW + BS / 2, 1);
        if (G.vx > 0 && G.bx + BS / 2 >= RX && G.bx < RX + PW) hit(G.pr, RX - BS / 2, -1);
        // point scored
        if (G.bx < -BS * 2 || G.bx > W + BS * 2) {
          const scorer = G.bx < 0 ? 1 : 0;
          G.score[scorer]++;
          G.flash[scorer] = 1;
          G.points++;
          G.serve = 1.1;
          if (G.score[scorer] >= 10) { G.score = [0, 0]; G.matchFlash = 1; G.serve = 2.2; }
        }
      }
      // paddles chase their target
      const ps = base * 1.6;
      for (const [p, px, dir] of [[G.pl, LX, -1], [G.pr, RX, 1]]) {
        const incoming = G.serve <= 0 && Math.sign(G.vx) === dir;
        p.target = incoming ? predict(dir > 0 ? RX : LX + PW) + p.err : 100 + (G.by - 100) * 0.3;
        const mv = (incoming ? ps : ps * 0.4) * dt;
        p.y = clamp(p.y + clamp(p.target - p.y, -mv, mv), PH / 2, H - PH / 2);
      }
    }

    function glow(x, y, r, col, a) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(col, a));
      g.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    function digit(d, x, y, s, col, a) {
      const m = DIG[d % 10];
      ctx.fillStyle = rgba(col, a);
      for (let i = 0; i < 15; i++) if (m[i] === '1') ctx.fillRect(x + (i % 3) * s, y + ((i / 3) | 0) * s, s - 1, s - 1);
    }

    function render() {
      const bc = cfg.ball, pc = cfg.pad;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      const bg = ctx.createRadialGradient(160, 100, 20, 160, 100, 200);
      bg.addColorStop(0, rgba(mix(pc, [0, 0, 0], 0.76), 1));
      bg.addColorStop(1, rgba(mix(pc, [0, 0, 0], 0.88), 1));
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
      // scoring side flash
      for (let i = 0; i < 2; i++) {
        if (G.flash[i] <= 0.01) continue;
        const k = G.flash[i];
        const on = Math.floor(k * 9) % 2 === 0 ? 1 : 0.55;
        const gx = i === 0 ? 0 : W;
        const g = ctx.createLinearGradient(gx, 0, 160, 0);
        g.addColorStop(0, rgba(bc, 0.75 * k * on));
        g.addColorStop(1, rgba(bc, 0.15 * k * on));
        ctx.fillStyle = g;
        ctx.fillRect(i === 0 ? 0 : 160, 0, 160, H);
      }
      if (G.matchFlash > 0.01) { ctx.fillStyle = rgba(mix(bc, pc, 0.5), 0.5 * G.matchFlash * (Math.floor(G.matchFlash * 12) % 2)); ctx.fillRect(0, 0, W, H); }
      // scores + centre net
      digit(G.score[0], 160 - 30 - 36, 14, 12, pc, 0.22);
      digit(G.score[1], 160 + 30, 14, 12, pc, 0.22);
      ctx.fillStyle = rgba(pc, 0.35);
      for (let y = 4; y < H; y += 20) ctx.fillRect(158, y, 4, 11);

      ctx.globalCompositeOperation = 'lighter';
      // paddles
      for (const [p, px, i] of [[G.pl, LX, 0], [G.pr, RX, 1]]) {
        const hk = G.hitGlow[i];
        glow(px + PW / 2, p.y, 58 + hk * 24, pc, 0.36 + hk * 0.4);
        ctx.fillStyle = rgba(mix(pc, [255, 255, 255], 0.2 + hk * 0.6), 1);
        ctx.fillRect(px, p.y - PH / 2, PW, PH);
      }
      // ball trail + ball
      if (G.serve <= 0) {
        const tr = G.trail, n = tr.length;
        for (let i = 0; i < n; i++) {
          const k = (i + 1) / n;
          const s = BS * (0.35 + 0.65 * k);
          ctx.fillStyle = rgba(bc, 0.45 * k * k);
          ctx.fillRect(tr[i][0] - s / 2, tr[i][1] - s / 2, s, s);
        }
        const hot = clamp((G.v - 1) / 1.8, 0, 1);
        glow(G.bx, G.by, 50 + hot * 24, bc, 0.5 + hot * 0.3);
        ctx.fillStyle = rgba(mix(bc, [255, 255, 255], 0.5), 1);
        ctx.fillRect(G.bx - BS / 2, G.by - BS / 2, BS, BS);
      } else {
        // blinking serve marker
        const a = (Math.sin(G.serve * 14) * 0.5 + 0.5) * 0.6;
        glow(160, 100, 30, bc, a);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    let last = null, acc = 0, trailAcc = 0;
    const STEP = 1 / 240;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 40) { step(STEP); acc -= STEP; n++; }
      if (n >= 40) acc = 0;
      // trail sampled at a fixed 60 Hz so its length is frame-rate independent
      trailAcc += dt;
      const maxLen = Math.round(cfg.trail / 100 * 22);
      while (trailAcc >= 1 / 60) {
        trailAcc -= 1 / 60;
        if (G.serve <= 0) G.trail.push([G.bx, G.by]);
      }
      if (trailAcc > 0.1) trailAcc = 0;
      while (G.trail.length > maxLen) G.trail.shift();
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
