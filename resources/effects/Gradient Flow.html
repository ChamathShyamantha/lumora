<head>
  <title>Gradient Flow</title>
  <meta description="A three-color gradient that scrolls endlessly at any angle." />
  <meta publisher="Lumora" />
  <meta category="Classic" />
  <meta energy="calm" />
  <meta palette="cool" />
  <meta tags="gradient,calm,colorful" />
  <meta property="color1" label="Color 1" type="color" default="#ff0080" />
  <meta property="color2" label="Color 2" type="color" default="#7a00ff" />
  <meta property="color3" label="Color 3" type="color" default="#00c8ff" />
  <meta property="angle" label="Angle" type="number" min="0" max="360" default="0" />
  <meta property="speed" label="Speed" type="number" min="1" max="100" default="30" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const hexRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    function buffer(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      const img = x.createImageData(w, h);
      return { c, x, img, d: img.data, w, h };
    }
    function present(b) {
      b.x.putImageData(b.img, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(b.c, 0, 0, W, H);
    }

    const B = buffer(80, 50);
    const cfg = { cols: [[255, 0, 128], [122, 0, 255], [0, 200, 255]], angle: 0, speed: 30 };
    let phase = 0;

    function readProps() {
      cfg.cols = [
        hexRgb(get(() => color1, '#ff0080'), '#ff0080'),
        hexRgb(get(() => color2, '#7a00ff'), '#7a00ff'),
        hexRgb(get(() => color3, '#00c8ff'), '#00c8ff')
      ];
      cfg.angle = num(get(() => angle), 0);
      cfg.speed = clamp(num(get(() => speed), 30), 0, 100);
    }
    function oncolor1Changed() { readProps(); }
    function oncolor2Changed() { readProps(); }
    function oncolor3Changed() { readProps(); }
    function onangleChanged() { readProps(); }
    function onspeedChanged() { readProps(); }

    function update(dt) {
      phase += dt * (0.01 + cfg.speed * 0.004);
      phase -= Math.floor(phase);
    }

    function render() {
      const a = cfg.angle * Math.PI / 180;
      const ux = Math.cos(a), uy = Math.sin(a);
      const L = 360; // one full color loop spans this many canvas pixels
      const c = cfg.cols, d = B.d, bw = B.w, bh = B.h, sx = W / bw, sy = H / bh;
      let o = 0;
      for (let j = 0; j < bh; j++) {
        const y = (j + 0.5) * sy - 100;
        for (let i = 0; i < bw; i++, o += 4) {
          const x = (i + 0.5) * sx - 160;
          let t = (x * ux + y * uy) / L - phase;
          t = (t - Math.floor(t)) * 3;
          const k = t | 0;
          let f = t - k;
          f = f * f * (3 - 2 * f);
          const A = c[k % 3], Bc = c[(k + 1) % 3];
          d[o] = A[0] + (Bc[0] - A[0]) * f;
          d[o + 1] = A[1] + (Bc[1] - A[1]) * f;
          d[o + 2] = A[2] + (Bc[2] - A[2]) * f;
          d[o + 3] = 255;
        }
      }
      present(B);
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
