<head>
  <title>Plasma</title>
  <meta description="Classic demoscene plasma: liquid, ever-shifting blobs of color." />
  <meta publisher="Lumora" />
  <meta category="Abstract" />
  <meta energy="lively" />
  <meta palette="rainbow" />
  <meta tags="colorful,psychedelic,classic" />
  <meta property="palette" label="Palette" type="combobox" values="Rainbow,Ocean,Sunset,Neon,Forest" default="Rainbow" />
  <meta property="speed" label="Speed" type="number" min="1" max="100" default="40" />
  <meta property="scale" label="Scale" type="number" min="1" max="100" default="50" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    function hsvTo(h, s, v, d, o) {
      h = (h - Math.floor(h)) * 6;
      const i = h | 0, f = h - i, p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
      let r, g, b;
      switch (i) {
        case 0: r = v; g = t; b = p; break;
        case 1: r = q; g = v; b = p; break;
        case 2: r = p; g = v; b = t; break;
        case 3: r = p; g = q; b = v; break;
        case 4: r = t; g = p; b = v; break;
        default: r = v; g = p; b = q;
      }
      d[o] = r * 255; d[o + 1] = g * 255; d[o + 2] = b * 255; d[o + 3] = 255;
    }
    function buffer(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      const img = x.createImageData(w, h);
      return { c, x, img, d: img.data, w, h };
    }
    function present(b) {
      b.x.putImageData(b.img, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(b.c, 0, 0, W, H);
    }

    // Cyclic palettes (the last stop blends back into the first).
    const PALETTES = {
      Ocean: [[0, 20, 60], [0, 90, 200], [0, 200, 255], [80, 255, 220], [0, 120, 210]],
      Sunset: [[60, 0, 80], [255, 0, 90], [255, 110, 0], [255, 200, 0], [255, 40, 60]],
      Neon: [[255, 0, 200], [110, 0, 255], [0, 220, 255], [0, 255, 120], [140, 0, 255]],
      Forest: [[0, 40, 0], [10, 120, 30], [110, 200, 0], [210, 230, 30], [20, 140, 50]]
    };
    const LUT = new Uint8ClampedArray(256 * 4);
    let builtFor = null;
    function buildLut(name) {
      const stops = PALETTES[name];
      for (let i = 0; i < 256; i++) {
        if (!stops) { hsvTo(i / 256, 1, 1, LUT, i * 4); continue; }
        const t = (i / 256) * stops.length;
        const k = t | 0;
        let f = t - k;
        f = f * f * (3 - 2 * f);
        const a = stops[k % stops.length], b = stops[(k + 1) % stops.length];
        LUT[i * 4] = a[0] + (b[0] - a[0]) * f;
        LUT[i * 4 + 1] = a[1] + (b[1] - a[1]) * f;
        LUT[i * 4 + 2] = a[2] + (b[2] - a[2]) * f;
        LUT[i * 4 + 3] = 255;
      }
      builtFor = name;
    }

    const B = buffer(80, 50);
    const cfg = { palette: 'Rainbow', speed: 40, scale: 50 };
    let t = 0;

    function readProps() {
      cfg.palette = String(get(() => palette, 'Rainbow'));
      cfg.speed = clamp(num(get(() => speed), 40), 0, 100);
      cfg.scale = clamp(num(get(() => scale), 50), 1, 100);
      if (builtFor !== cfg.palette) buildLut(cfg.palette);
    }
    function onpaletteChanged() { readProps(); }
    function onspeedChanged() { readProps(); }
    function onscaleChanged() { readProps(); }

    function update(dt) {
      t += dt * (0.1 + cfg.speed * 0.03);
      if (t > 1e5) t = 0;
    }

    function render() {
      const k = 0.012 + (100 - cfg.scale) * 0.0008;
      const cx = 160 + 110 * Math.sin(t * 0.31), cy = 100 + 70 * Math.cos(t * 0.37);
      const shift = t * 0.04;
      const d = B.d, bw = B.w, bh = B.h, sx = W / bw, sy = H / bh;
      let o = 0;
      for (let j = 0; j < bh; j++) {
        const y = (j + 0.5) * sy;
        const sy1 = Math.sin(y * k * 1.3 - t * 0.8);
        for (let i = 0; i < bw; i++, o += 4) {
          const x = (i + 0.5) * sx;
          const dx = x - cx, dy = y - cy;
          let v = Math.sin(x * k + t) + sy1 +
            Math.sin((x * 0.6 + y * 0.8) * k + t * 0.6) +
            Math.sin(Math.sqrt(dx * dx + dy * dy) * k * 1.2 - t * 1.1);
          v = v * 0.125 + 0.5 + shift;
          const li = ((v - Math.floor(v)) * 256 | 0) & 255;
          const l = li * 4;
          d[o] = LUT[l]; d[o + 1] = LUT[l + 1]; d[o + 2] = LUT[l + 2]; d[o + 3] = 255;
        }
      }
      present(B);
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
