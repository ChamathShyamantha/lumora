<head>
  <title>Breathing</title>
  <meta description="A slow, soothing glow that fades in and out like a sleeping breath." />
  <meta publisher="Lumora" />
  <meta category="Classic" />
  <meta energy="calm" />
  <meta palette="cool" />
  <meta tags="calm,simple,pulse" />
  <meta property="color" label="Color" type="color" default="#00a2ff" />
  <meta property="speed" label="Speed" type="number" min="1" max="100" default="30" />
  <meta property="minBrightness" label="Minimum Brightness" type="number" min="0" max="100" default="5" />
  <meta property="rainbow" label="Rainbow" type="boolean" default="0" tooltip="Shift to a new hue on every breath" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const bool = (v, d) => (v === undefined || v === null ? d : v === true || v === 1 || v === '1' || v === 'true');
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const hexRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    function hsv(h, s, v) {
      h = (h - Math.floor(h)) * 6;
      const i = h | 0, f = h - i, p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
      switch (i) {
        case 0: return [v, t, p];
        case 1: return [q, v, p];
        case 2: return [p, v, t];
        case 3: return [p, q, v];
        case 4: return [t, p, v];
        default: return [v, p, q];
      }
    }
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
      let h = 0;
      if (d > 0) {
        if (mx === r) h = ((g - b) / d) % 6;
        else if (mx === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h /= 6;
        if (h < 0) h += 1;
      }
      return [h, mx === 0 ? 0 : d / mx, mx];
    }

    const cfg = { rgb: [0, 162, 255], hsv: [0.56, 1, 1], speed: 30, min: 0.05, rainbow: false };
    let phase = 0;

    function readProps() {
      cfg.rgb = hexRgb(get(() => color, '#00a2ff'), '#00a2ff');
      cfg.hsv = rgbToHsv(cfg.rgb[0], cfg.rgb[1], cfg.rgb[2]);
      cfg.speed = clamp(num(get(() => speed), 30), 0, 100);
      cfg.min = clamp(num(get(() => minBrightness), 5), 0, 100) / 100;
      cfg.rainbow = bool(get(() => rainbow), false);
    }
    function oncolorChanged() { readProps(); }
    function onspeedChanged() { readProps(); }
    function onminBrightnessChanged() { readProps(); }
    function onrainbowChanged() { readProps(); }

    function update(dt) {
      phase += dt * (0.05 + cfg.speed * 0.008); // breaths per second
      if (phase > 1e6) phase = 0;
    }

    function render() {
      const cycle = Math.floor(phase);
      const f = phase - cycle;
      // 0 at the start of each breath (darkest point) so hue changes are invisible
      let b = 0.5 - 0.5 * Math.cos(f * Math.PI * 2);
      b = b * b * (3 - 2 * b);
      const level = cfg.min + (1 - cfg.min) * b;
      let r, g, bl;
      if (cfg.rainbow) {
        const s = cfg.hsv[1] < 0.2 ? 1 : cfg.hsv[1];
        const v = cfg.hsv[2] < 0.2 ? 1 : cfg.hsv[2];
        const c = hsv(cfg.hsv[0] + cycle * 0.137, s, v);
        r = c[0] * 255; g = c[1] * 255; bl = c[2] * 255;
      } else {
        r = cfg.rgb[0]; g = cfg.rgb[1]; bl = cfg.rgb[2];
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgb(' + Math.round(r * level) + ',' + Math.round(g * level) + ',' + Math.round(bl * level) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
