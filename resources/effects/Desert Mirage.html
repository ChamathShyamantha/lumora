<head>
  <title>Desert Mirage</title>
  <meta description="Heat haze ripples over sunset dunes while a phantom lake of sky shimmers on the sand." />
  <meta publisher="Lumora" />
  <meta category="Nature" />
  <meta energy="calm" />
  <meta palette="warm" />
  <meta tags="nature,desert,dunes,sand,mirage,heat,haze,sunset,summer,orange,warm,calm" />
  <meta property="skyPalette" label="Sky" type="combobox" values="Sunset,Golden Hour,Crimson,Twilight" default="Sunset" />
  <meta property="shimmer" label="Shimmer" tooltip="Strength of the heat haze" type="number" min="0" max="100" default="55" />
  <meta property="speed" label="Speed" type="number" min="1" max="100" default="35" />
  <meta property="mirage" label="Mirage" tooltip="How much of the sky is reflected on the sand" type="number" min="0" max="100" default="60" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const smooth = (a, b, v) => { const x = clamp((v - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
    function buffer(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      const img = x.createImageData(w, h);
      return { c, x, img, d: img.data, w, h };
    }
    function present(b) {
      b.x.putImageData(b.img, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(b.c, 0, 0, W, H);
    }
    const PERM = new Uint8Array(512);
    (function () {
      const p = []; let s = 5150;
      for (let i = 0; i < 256; i++) p[i] = i;
      for (let i = 255; i > 0; i--) { s = (s * 16807) % 2147483647; const j = s % (i + 1); const tmp = p[i]; p[i] = p[j]; p[j] = tmp; }
      for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
    })();
    function vnoise(x, y) {
      let xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      xi &= 255; yi &= 255;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      const a = PERM[PERM[xi] + yi], b = PERM[PERM[xi + 1] + yi], c = PERM[PERM[xi] + yi + 1], d = PERM[PERM[xi + 1] + yi + 1];
      const top = a + (b - a) * u, bot = c + (d - c) * u;
      return (top + (bot - top) * v) / 255;
    }

    // sky stops (0 = zenith, 1 = horizon), sun, dune light/shadow, desert floor
    const PALS = {
      'Sunset': { sky: [[0, 48, 22, 96], [0.45, 196, 62, 98], [0.8, 255, 138, 64], [1, 255, 206, 120]], sun: [255, 236, 170], lit: [236, 128, 58], dark: [92, 34, 40], floor: [210, 120, 70] },
      'Golden Hour': { sky: [[0, 34, 70, 150], [0.45, 235, 140, 60], [0.82, 255, 172, 50], [1, 255, 210, 110]], sun: [255, 238, 170], lit: [240, 150, 50], dark: [120, 56, 24], floor: [220, 140, 60] },
      'Crimson': { sky: [[0, 30, 6, 30], [0.45, 140, 20, 40], [0.8, 240, 60, 40], [1, 255, 140, 70]], sun: [255, 200, 130], lit: [210, 70, 40], dark: [70, 14, 22], floor: [180, 60, 40] },
      'Twilight': { sky: [[0, 14, 16, 60], [0.5, 80, 50, 130], [0.82, 220, 100, 120], [1, 255, 170, 120]], sun: [255, 210, 170], lit: [170, 90, 110], dark: [44, 26, 60], floor: [150, 80, 100] }
    };
    const BW = 128, BH = 80, SX = W / BW, SY = H / BH;
    const B = buffer(BW, BH);
    const HZ = 112;               // horizon line
    const SUNX = 205, SUNY = HZ - 16, SUNR = 24;
    const cfg = { pal: 'Sunset', shimmer: 55, speed: 35, mirage: 60 };
    let t = 0;

    function readProps() {
      const p = String(get(() => skyPalette, 'Sunset'));
      cfg.pal = PALS[p] ? p : 'Sunset';
      cfg.shimmer = clamp(num(get(() => shimmer), 55), 0, 100);
      cfg.speed = clamp(num(get(() => speed), 35), 0, 100);
      cfg.mirage = clamp(num(get(() => mirage), 60), 0, 100);
    }
    function onskyPaletteChanged() { readProps(); }
    function onshimmerChanged() { readProps(); }
    function onspeedChanged() { readProps(); }
    function onmirageChanged() { readProps(); }

    const sc = [0, 0, 0];
    function skyAt(P, x, y, out, noSun) {
      const s = P.sky;
      const p = clamp(y / HZ, 0, 1);
      let k = 0;
      while (k < s.length - 2 && p > s[k + 1][0]) k++;
      const a = s[k], b = s[k + 1];
      const f = clamp((p - a[0]) / (b[0] - a[0]), 0, 1);
      let r = a[1] + (b[1] - a[1]) * f, g = a[2] + (b[2] - a[2]) * f, bl = a[3] + (b[3] - a[3]) * f;
      // the sun: a soft disc with a wide glow
      const dx = x - SUNX, dy = (y - SUNY) * 1.1, dd = noSun ? 1e4 : Math.sqrt(dx * dx + dy * dy);
      const disc = smooth(SUNR + 2, SUNR - 2, dd);
      const halo = Math.exp(-dd / 55) * 0.55 + Math.exp(-dd / 16) * 0.35;
      r += (P.sun[0] - r) * disc + P.sun[0] * halo * 0.5;
      g += (P.sun[1] - g) * disc + P.sun[1] * halo * 0.4;
      bl += (P.sun[2] - bl) * disc + P.sun[2] * halo * 0.25;
      // long thin clouds catching the light
      const band = Math.exp(-Math.pow((y - 38 - 6 * Math.sin(x * 0.012 + 1)) / 7, 2)) + 0.7 * Math.exp(-Math.pow((y - 70 - 4 * Math.sin(x * 0.02)) / 5, 2));
      const cl = band * (0.3 + 0.7 * vnoise(x * 0.012 - t * 0.02, y * 0.05)) * 0.35;
      r += (P.sun[0] - r) * cl; g += (P.sun[1] * 0.75 - g) * cl; bl += (P.sun[2] * 0.6 - bl) * cl;
      out[0] = r; out[1] = g; out[2] = bl;
    }
    // dune ridgelines, far to near
    const ridge = [
      (x) => HZ + 14 - 24 * Math.pow(Math.max(0, Math.sin(x * 0.017 + 0.4)), 1.5) - 3 * Math.sin(x * 0.05 + 2.1),
      (x) => HZ + 30 + 13 * Math.sin(x * 0.014 + 2.5) + 5 * Math.sin(x * 0.043),
      (x) => HZ + 62 + 16 * Math.sin(x * 0.011 + 4.2) + 6 * Math.sin(x * 0.037 + 1.3)
    ];
    const dslope = (k, x) => ridge[k](x + 2) - ridge[k](x - 2);

    function update(dt) {
      t += dt * (0.2 + cfg.speed * 0.025);
      if (t > 1e5) t = 0;
    }

    function render() {
      const P = PALS[cfg.pal];
      const d = B.d;
      const S = cfg.shimmer / 100 * 4.5;
      const M = cfg.mirage / 100;
      let o = 0;
      for (let j = 0; j < BH; j++) {
        const y0 = (j + 0.5) * SY;
        // heat haze is strongest just above the hot ground near the horizon
        const hz = Math.exp(-Math.pow((y0 - HZ - 4) / 20, 2)) + 0.12 * smooth(HZ, H, y0);
        for (let i = 0; i < BW; i++, o += 4) {
          const x0 = (i + 0.5) * SX;
          const wob = Math.sin(x0 * 0.02 + t * 0.7) * 1.5;
          const x = x0 + S * hz * (2.2 * Math.sin(y0 * 0.36 - t * 3.1 + wob) + 1.1 * Math.sin(y0 * 0.83 + x0 * 0.05 - t * 4.7));
          const y = y0 + S * hz * 0.35 * Math.sin(x0 * 0.06 + y0 * 0.2 - t * 2.3);
          let r, g, b;
          if (y < HZ) {
            skyAt(P, x, y, sc); r = sc[0]; g = sc[1]; b = sc[2];
          } else {
            // flat desert floor, hazy toward the horizon
            const k = smooth(HZ, H, y);
            skyAt(P, x, HZ - 1, sc);
            r = sc[0] * (1 - k) * 0.55 + P.floor[0] * (0.45 + 0.4 * k);
            g = sc[1] * (1 - k) * 0.55 + P.floor[1] * (0.45 + 0.4 * k);
            b = sc[2] * (1 - k) * 0.55 + P.floor[2] * (0.45 + 0.4 * k);
            // the mirage: a band where the floor mirrors the sky, coming and going
            const pool = smooth(0.3, 0.65, vnoise(x * 0.012 + t * 0.03, 3.7)) * Math.exp(-Math.pow((y - HZ - 6) / 8, 2)) * M;
            if (pool > 0.01) {
              skyAt(P, x, 2 * HZ - y + 6 * Math.sin(x * 0.08 + t * 2), sc);
              r += (sc[0] - r) * pool * 0.85; g += (sc[1] - g) * pool * 0.85; b += (sc[2] - b) * pool * 0.85;
            }
          }
          // dunes, far to near, with soft anti-aliased crests
          for (let k = 0; k < 3; k++) {
            const ry = ridge[k](x);
            const cov = smooth(ry - 1.6, ry + 1.6, y);
            if (cov > 0) {
              const depth = Math.max(0, y - ry);
              const sl = dslope(k, x);           // the sun is to the right: right-facing slopes are lit
              const lit = clamp(0.5 - sl * 0.35, 0, 1);
              const crest = Math.exp(-depth / 5) * 0.45;
              const fade = k === 0 ? 0.45 : k === 1 ? 0.2 : 0;   // atmospheric haze on far dunes
              skyAt(P, x, HZ - 2, sc, true);
              let dr = P.dark[0] + (P.lit[0] - P.dark[0]) * lit + P.sun[0] * crest * lit;
              let dg = P.dark[1] + (P.lit[1] - P.dark[1]) * lit + P.sun[1] * crest * lit * 0.8;
              let db = P.dark[2] + (P.lit[2] - P.dark[2]) * lit + P.sun[2] * crest * lit * 0.5;
              dr += (sc[0] - dr) * fade; dg += (sc[1] - dg) * fade; db += (sc[2] - db) * fade;
              r += (dr - r) * cov; g += (dg - g) * cov; b += (db - b) * cov;
            }
          }
          // shimmering brightness in the haze
          const sh = 1 + 0.025 * S * hz * Math.sin(y0 * 0.5 - t * 3.7 + x0 * 0.04);
          d[o] = r * sh; d[o + 1] = g * sh; d[o + 2] = b * sh; d[o + 3] = 255;
        }
      }
      present(B);
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
