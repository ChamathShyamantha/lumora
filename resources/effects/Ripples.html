<head>
  <title>Ripples</title>
  <meta description="Glowing rings spread outward from random points like raindrops on a pond." />
  <meta publisher="Lumora" />
  <meta category="Abstract" />
  <meta energy="calm" />
  <meta palette="rainbow" />
  <meta tags="calm,water,colorful" />
  <meta property="spawnRate" label="Spawn Rate" type="number" min="1" max="100" default="40" />
  <meta property="rippleSpeed" label="Ripple Speed" type="number" min="1" max="100" default="50" />
  <meta property="rainbow" label="Rainbow" type="boolean" default="1" />
  <meta property="color" label="Color" type="color" default="#00b4ff" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const bool = (v, d) => (v === undefined || v === null ? d : v === true || v === 1 || v === '1' || v === 'true');
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const hexRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    function hsv(h, s, v) {
      h = (h - Math.floor(h)) * 6;
      const i = h | 0, f = h - i, p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
      switch (i) {
        case 0: return [v, t, p];
        case 1: return [q, v, p];
        case 2: return [p, v, t];
        case 3: return [p, q, v];
        case 4: return [t, p, v];
        default: return [v, p, q];
      }
    }
    const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + clamp(a, 0, 1).toFixed(3) + ')';

    const MAX_R = 240;
    const cfg = { rate: 40, speed: 50, rainbow: true, rgb: [0, 180, 255] };
    const rings = [];
    let acc = 0.8, hueBase = Math.random();

    function readProps() {
      cfg.rate = clamp(num(get(() => spawnRate), 40), 1, 100);
      cfg.speed = clamp(num(get(() => rippleSpeed), 50), 0, 100);
      cfg.rainbow = bool(get(() => rainbow), true);
      cfg.rgb = hexRgb(get(() => color, '#00b4ff'), '#00b4ff');
    }
    function onspawnRateChanged() { readProps(); }
    function onrippleSpeedChanged() { readProps(); }
    function onrainbowChanged() { readProps(); }
    function oncolorChanged() { readProps(); }

    function update(dt) {
      hueBase += dt * 0.03;
      acc += dt * (0.15 + cfg.rate * 0.035);
      while (acc >= 1) {
        acc -= 1;
        if (rings.length < 40) {
          rings.push({ x: 20 + Math.random() * (W - 40), y: 15 + Math.random() * (H - 30), r: 0, hue: hueBase + Math.random() * 0.35 });
        }
      }
      const v = 30 + cfg.speed * 2.5;
      for (let i = rings.length - 1; i >= 0; i--) {
        rings[i].r += v * dt;
        if (rings[i].r > MAX_R) rings.splice(i, 1);
      }
    }

    function render() {
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for (const g of rings) {
        const life = g.r / MAX_R;
        const a = Math.pow(1 - life, 1.3) * Math.min(1, g.r / 12);
        if (a < 0.01) continue;
        let c;
        if (cfg.rainbow) { const h = hsv(g.hue, 1, 1); c = [h[0] * 255, h[1] * 255, h[2] * 255]; }
        else c = cfg.rgb;
        const w = 14 + g.r * 0.08;
        const inner = Math.max(0, g.r - w), outer = g.r + w;
        const grad = ctx.createRadialGradient(g.x, g.y, inner, g.x, g.y, outer);
        grad.addColorStop(0, rgba(c, 0));
        grad.addColorStop(0.5, rgba(c, a));
        grad.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = grad;
        ctx.fillRect(g.x - outer, g.y - outer, outer * 2, outer * 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
