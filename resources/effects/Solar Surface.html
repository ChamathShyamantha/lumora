<head>
  <title>Solar Surface</title>
  <meta description="Hover just above a seething star: boiling granules churn across its face while looping flares of plasma arc off the glowing limb." />
  <meta publisher="Lumora" />
  <meta category="Space" />
  <meta energy="lively" />
  <meta palette="warm" />
  <meta tags="space,sun,star,solar,flare,plasma,fire,corona,hot" />
  <meta property="activity" label="Activity" type="number" min="1" max="100" default="45" tooltip="How fast the surface boils and how many sunspots form" />
  <meta property="flareRate" label="Flare Frequency" type="number" min="0" max="100" default="50" tooltip="How often plasma loops erupt from the limb" />
  <meta property="temperature" label="Colour Temperature" type="number" min="0" max="100" default="45" tooltip="Low is a deep red dwarf, high is a white-hot star" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200, LW = 80, LH = 50, S = W / LW;
    // the star is a huge disc whose upper limb curves across the canvas
    const SX = 160, SY = 330, SR = 262;
    const read = (f, d) => { try { const v = f(); return v === undefined || v === null || v === '' ? d : v; } catch (e) { return d; } };
    const numIn = (v, d, lo, hi) => { const n = Number(v); return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
    const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
    const sstep = (a, b, v) => { const x = clamp01((v - a) / (b - a)); return x * x * (3 - 2 * x); };

    let seed = 4471;
    const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const PERM = new Uint16Array(512), VAL = new Float32Array(256);
    for (let i = 0; i < 256; i++) { PERM[i] = i; VAL[i] = rand(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); const s = PERM[i]; PERM[i] = PERM[j]; PERM[j] = s; }
    for (let i = 0; i < 256; i++) PERM[i + 256] = PERM[i];
    const hash = (x, y) => VAL[PERM[PERM[x & 255] + (y & 255)]];
    function noise(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      let fx = x - xi, fy = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = VAL[PERM[PERM[X] + Y]], b = VAL[PERM[PERM[X + 1] + Y]];
      const c = VAL[PERM[PERM[X] + Y + 1]], d = VAL[PERM[PERM[X + 1] + Y + 1]];
      fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
    }
    function fbm(x, y, oct) {
      let s = 0, amp = 0.5, n = 0;
      for (let o = 0; o < oct; o++) {
        s += amp * noise(x, y); n += amp;
        const nx = 1.7 * x + 1.1 * y, ny = -1.1 * x + 1.7 * y;
        x = nx + 11.3; y = ny + 4.1; amp *= 0.5;
      }
      return s / n;
    }
    // convection cells: bright granule centres separated by dark lanes
    function granule(x, y, t) {
      const xi = Math.floor(x), yi = Math.floor(y);
      let f1 = 9, f2 = 9, id = 0;
      for (let j = -1; j <= 1; j++) {
        for (let i = -1; i <= 1; i++) {
          const cx = xi + i, cy = yi + j;
          const h1 = hash(cx, cy), h2 = hash(cx + 37, cy + 91);
          const px = cx + 0.5 + 0.38 * Math.sin(t * (0.6 + h2) + h1 * 6.28);
          const py = cy + 0.5 + 0.38 * Math.cos(t * (0.5 + h1) + h2 * 6.28);
          const dx = px - x, dy = py - y;
          const d = dx * dx + dy * dy;
          if (d < f1) { f2 = f1; f1 = d; id = h1; } else if (d < f2) f2 = d;
        }
      }
      // each granule has its own brightness, and they slowly heat and cool
      const pulse = 0.5 + 0.5 * Math.sin(t * 0.7 + id * 40);
      return sstep(0, 0.32, Math.sqrt(f2) - Math.sqrt(f1)) * (0.7 + 0.3 * pulse) + (id - 0.5) * 0.25;
    }

    // heat ramp: black-red -> red -> orange -> yellow -> white
    const RAMP = [[0, 20, 0, 0], [0.22, 150, 12, 0], [0.45, 255, 70, 0], [0.68, 255, 160, 20], [0.86, 255, 225, 110], [1, 255, 255, 235]];
    function heat(v, out) {
      v = clamp01(v);
      let i = 1;
      while (i < RAMP.length - 1 && v > RAMP[i][0]) i++;
      const a = RAMP[i - 1], b = RAMP[i], k = (v - a[0]) / (b[0] - a[0]);
      out[0] = a[1] + (b[1] - a[1]) * k; out[1] = a[2] + (b[2] - a[2]) * k; out[2] = a[3] + (b[3] - a[3]) * k;
      return out;
    }

    const cfg = { activity: 45, flares: 50, temp: 45 };
    function readProps() {
      cfg.activity = numIn(read(() => activity, 45), 45, 0, 100);
      cfg.flares = numIn(read(() => flareRate, 50), 50, 0, 100);
      cfg.temp = numIn(read(() => temperature, 45), 45, 0, 100);
    }
    function onactivityChanged() { readProps(); }
    function onflareRateChanged() { readProps(); }
    function ontemperatureChanged() { readProps(); }

    const buf = document.createElement('canvas');
    buf.width = LW; buf.height = LH;
    const bctx = buf.getContext('2d');
    const img = bctx.createImageData(LW, LH);
    const px = img.data;
    const tmp = [0, 0, 0];

    let churn = 0, clock = 0, spin = 0;

    function renderStar() {
      const shift = (cfg.temp - 50) / 50 * 0.17;
      const spotAmt = 0.3 + cfg.activity / 100 * 0.7;
      const cx = SX / S, cy = SY / S, R = SR / S;
      let o = 0;
      for (let j = 0; j < LH; j++) {
        for (let i = 0; i < LW; i++) {
          const dx = i + 0.5 - cx, dy = j + 0.5 - cy;
          const d = Math.sqrt(dx * dx + dy * dy);
          let v = 0;
          const edge = sstep(R - 0.9, R + 0.9, d);
          if (edge < 1) {
            const nx = dx / R, ny = dy / R, mu = Math.sqrt(Math.max(0.0004, 1 - nx * nx - ny * ny));
            const lon = Math.atan2(nx, mu) * 2.2 + spin, lat = Math.asin(Math.max(-1, Math.min(1, ny))) * 2.2;
            const g = granule(lon * 3.6, lat * 3.6, churn);
            const big = fbm(lon * 1.3 + churn * 0.04, lat * 1.3 - churn * 0.02, 3);
            const spot = sstep(0.68, 0.77, big) * spotAmt;
            const fac = sstep(0.5, 0.66, big) * (1 - spot);
            let sv = 0.5 + 0.2 * g + 0.17 * fac - 0.5 * spot;
            sv *= 0.6 + 0.4 * Math.pow(mu, 0.5);
            v += (sv + shift) * (1 - edge);
          }
          if (edge > 0) {
            const h = Math.max(0, d - R);
            const ang = Math.atan2(dy, dx);
            const rays = fbm(ang * 9 + 30, h * 0.06 - churn * 0.12, 3);
            let cv2 = 0.62 * Math.exp(-h / (2.2 + 3.2 * rays)) + 0.32 * Math.exp(-h / 14) + 0.06;
            cv2 = cv2 * 0.9 + shift * 0.5 * cv2;
            v += cv2 * edge;
          }
          heat(v, tmp);
          px[o] = tmp[0]; px[o + 1] = tmp[1]; px[o + 2] = tmp[2]; px[o + 3] = 255;
          o += 4;
        }
      }
      bctx.putImageData(img, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(buf, 0, 0, W, H);
    }

    // ---- prominences ---------------------------------------------------------
    const flares = [];
    let flareTimer = 1;
    const ANG_MIN = -2.2, ANG_MAX = -0.94;
    function spawnFlare() {
      flares.push({
        th: ANG_MIN + 0.08 + Math.random() * (ANG_MAX - ANG_MIN - 0.16),
        span: 0.05 + Math.random() * 0.09,
        hgt: 26 + Math.random() * 48,
        life: 0,
        dur: 4.5 + Math.random() * 4,
        seed: Math.random() * 10
      });
    }
    function limb(th, r) { return [SX + Math.cos(th) * r, SY + Math.sin(th) * r]; }
    function drawFlares() {
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      const warm = (cfg.temp - 50) / 50 * 0.12;
      for (const f of flares) {
        const rise = sstep(0, 0.35, f.life), fade = 1 - sstep(0.65, 1, f.life);
        const env = rise * fade;
        if (env < 0.01) continue;
        const h = f.hgt * (0.35 + 0.65 * rise);
        // foot-point glow
        const mid = limb(f.th, SR);
        const fr = 34 + h * 0.5;
        const fg = ctx.createRadialGradient(mid[0], mid[1], 0, mid[0], mid[1], fr);
        heat(0.8 + warm, tmp);
        fg.addColorStop(0, 'rgba(' + (tmp[0] | 0) + ',' + (tmp[1] | 0) + ',' + (tmp[2] | 0) + ',' + (0.4 * env).toFixed(3) + ')');
        fg.addColorStop(1, 'rgba(255,80,0,0)');
        ctx.fillStyle = fg;
        ctx.fillRect(mid[0] - fr, mid[1] - fr, fr * 2, fr * 2);
        // several twisting plasma strands
        for (let k = 0; k < 3; k++) {
          const wob = Math.sin(clock * 1.3 + f.seed + k * 2.1);
          const sp = f.span * (0.8 + 0.18 * k);
          const a = limb(f.th - sp, SR - 2), b = limb(f.th + sp, SR - 2);
          const c = limb(f.th + wob * 0.025, SR + h * (1.75 + 0.15 * k));
          const passes = [[18, 0.12, 0.5], [8, 0.28, 0.66], [3, 0.7, 0.9]];
          for (const p of passes) {
            heat(p[2] + warm, tmp);
            ctx.strokeStyle = 'rgba(' + (tmp[0] | 0) + ',' + (tmp[1] | 0) + ',' + (tmp[2] | 0) + ',' + (p[1] * env * (k === 0 ? 1 : 0.6)).toFixed(3) + ')';
            ctx.lineWidth = p[0] * (k === 0 ? 1 : 0.7);
            ctx.beginPath();
            ctx.moveTo(a[0], a[1]);
            ctx.quadraticCurveTo(c[0], c[1], b[0], b[1]);
            ctx.stroke();
          }
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      let dt = last === null ? 1 / 60 : (now - last) / 1000;
      last = now;
      if (!(dt >= 0)) dt = 0;
      if (dt > 0.1) dt = 0.1;
      readProps();
      clock += dt;
      churn += dt * (0.25 + cfg.activity * 0.022);
      spin += dt * 0.012;
      const rate = cfg.flares <= 0 ? 0 : 0.06 + cfg.flares * 0.006;
      flareTimer -= dt * rate;
      if (rate > 0 && (flareTimer <= 0 || flares.length === 0)) {
        if (flares.length < 6) spawnFlare();
        flareTimer = 0.6 + Math.random() * 0.8;
      }
      for (let i = flares.length - 1; i >= 0; i--) {
        flares[i].life += dt / flares[i].dur;
        if (flares[i].life >= 1) flares.splice(i, 1);
      }
      renderStar();
      drawFlares();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
