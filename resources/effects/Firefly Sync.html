<head>
  <title>Firefly Sync</title>
  <meta description="Fireflies drift over a dusk meadow, blinking out of step until they fall into rhythm and flash together, then scatter and begin again." />
  <meta publisher="Lumora" />
  <meta category="Nature" />
  <meta energy="calm" />
  <meta palette="natural" />
  <meta tags="nature,fireflies,sync,synchrony,summer,dusk,meadow,night,glow,calm,pulse" />
  <meta property="count" label="Fireflies" type="number" min="5" max="60" default="30" />
  <meta property="syncStrength" label="Sync Strength" tooltip="How strongly fireflies pull each other into step" type="number" min="0" max="100" default="55" />
  <meta property="glowColor" label="Glow Color" type="color" default="#c6ff3c" />
  <meta property="flashRate" label="Flash Rate" type="number" min="1" max="100" default="45" />
  <meta property="meadow" label="Meadow Light" tooltip="Brightness of the dusk sky and meadow" type="number" min="0" max="100" default="55" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200, TAU = Math.PI * 2;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const fin = (v) => (isFinite(v) ? v : 0);
    const hexRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const rgba = (c, a) => 'rgba(' + (clamp(fin(c[0]), 0, 255) | 0) + ',' + (clamp(fin(c[1]), 0, 255) | 0) + ',' + (clamp(fin(c[2]), 0, 255) | 0) + ',' + clamp(fin(a), 0, 1).toFixed(3) + ')';

    const MAXN = 60;
    const cfg = { count: 30, sync: 55, glow: [198, 255, 60], rate: 45, meadow: 55 };
    const flies = [];
    let t = 0, coupling = 0, lockedFor = 0, cycleAge = 0, order = 0, ambient = 0;

    function newFly(f) {
      f = f || {};
      f.x = Math.random() * W;
      f.y = 70 + Math.random() * 115;
      f.hd = Math.random() * TAU;
      f.sp = 5 + Math.random() * 7;
      f.wob = Math.random() * 100;
      f.th = Math.random() * TAU;
      f.w = 1 + (Math.random() - 0.5) * 0.18;  // natural frequency spread
      f.z = 0.65 + Math.random() * 0.55;         // depth: size + brightness
      f.kick = 0;
      f.b = 0;
      return f;
    }
    for (let i = 0; i < MAXN; i++) flies.push(newFly());

    function scatter() {
      for (const f of flies) {
        f.th = Math.random() * TAU;
        f.hd = Math.random() * TAU;
        f.kick = 2.2 + Math.random() * 1.5;
      }
      coupling = 0;
      lockedFor = 0;
      cycleAge = 0;
    }

    // Static dusk backdrop, rebuilt when the meadow brightness changes.
    const bg = document.createElement('canvas');
    bg.width = W; bg.height = H;
    const bx = bg.getContext('2d');
    let bgFor = -1;
    function buildBg(level) {
      const k = 0.35 + level / 100 * 0.9;
      const sc = (c) => [c[0] * k, c[1] * k, c[2] * k];
      const g = bx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, rgba(sc([14, 18, 52]), 1));
      g.addColorStop(0.32, rgba(sc([40, 34, 86]), 1));
      g.addColorStop(0.5, rgba(sc([92, 58, 96]), 1));
      g.addColorStop(0.58, rgba(sc([60, 58, 64]), 1));
      g.addColorStop(0.7, rgba(sc([16, 46, 28]), 1));
      g.addColorStop(1, rgba(sc([6, 24, 12]), 1));
      bx.fillStyle = g;
      bx.fillRect(0, 0, W, H);
      // last light glowing on the horizon
      const hg = bx.createRadialGradient(220, 112, 0, 220, 112, 170);
      hg.addColorStop(0, rgba(sc([150, 80, 70]), 0.55));
      hg.addColorStop(1, rgba(sc([150, 80, 70]), 0));
      bx.fillStyle = hg;
      bx.fillRect(0, 0, W, H);
      // tree line silhouette
      bx.fillStyle = rgba(sc([10, 22, 20]), 1);
      bx.beginPath();
      bx.moveTo(0, 125);
      for (let x = 0; x <= W; x += 8) {
        const y = 112 - 12 * Math.max(0, Math.sin(x * 0.021 + 1)) - 7 * Math.max(0, Math.sin(x * 0.057 + 2)) - 3 * Math.sin(x * 0.19);
        bx.lineTo(x, y);
      }
      bx.lineTo(W, 130); bx.lineTo(0, 130); bx.closePath(); bx.fill();
      // meadow with soft rolling rise
      const mg = bx.createLinearGradient(0, 118, 0, H);
      mg.addColorStop(0, rgba(sc([22, 54, 32]), 1));
      mg.addColorStop(1, rgba(sc([6, 22, 10]), 1));
      bx.fillStyle = mg;
      bx.beginPath();
      bx.moveTo(0, 128);
      for (let x = 0; x <= W; x += 10) bx.lineTo(x, 124 + 6 * Math.sin(x * 0.014 + 0.6));
      bx.lineTo(W, H); bx.lineTo(0, H); bx.closePath(); bx.fill();
      // grass blades in the foreground
      let s = 7;
      const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
      bx.fillStyle = rgba(sc([4, 16, 8]), 1);
      for (let i = 0; i < 140; i++) {
        const x = rnd() * W, hgt = 14 + rnd() * 34, lean = (rnd() - 0.5) * 14;
        bx.beginPath();
        bx.moveTo(x - 2.5, H); bx.quadraticCurveTo(x + lean * 0.3, H - hgt * 0.6, x + lean, H - hgt); bx.lineTo(x + 2.5, H);
        bx.closePath(); bx.fill();
      }
      bgFor = level;
    }

    function readProps() {
      cfg.count = Math.round(clamp(num(get(() => count), 30), 5, MAXN));
      cfg.sync = clamp(num(get(() => syncStrength), 55), 0, 100);
      cfg.glow = hexRgb(get(() => glowColor, '#c6ff3c'), '#c6ff3c');
      cfg.rate = clamp(num(get(() => flashRate), 45), 1, 100);
      cfg.meadow = clamp(num(get(() => meadow), 55), 0, 100);
      if (bgFor !== cfg.meadow) buildBg(cfg.meadow);
    }
    function oncountChanged() { readProps(); }
    function onsyncStrengthChanged() { readProps(); }
    function onglowColorChanged() { readProps(); }
    function onflashRateChanged() { readProps(); }
    function onmeadowChanged() { readProps(); }

    const dth = new Float32Array(MAXN);
    function update(dt) {
      t += dt;
      if (t > 1e5) t = 0;
      cycleAge += dt;
      const n = cfg.count;
      const omega = TAU * (0.28 + cfg.rate * 0.0075);   // base flashes per second
      // coupling ramps up after each scatter, so the meadow visibly falls into step
      const kMax = cfg.sync / 100 * 2.6;
      coupling += (kMax - coupling) * (1 - Math.exp(-dt / 9));

      // Kuramoto with visual-range weighting: neighbours influence each other most,
      // so synchrony spreads across the meadow in waves.
      let sx = 0, sy = 0;
      for (let i = 0; i < n; i++) {
        const a = flies[i];
        let s = 0, wsum = 0;
        for (let j = 0; j < n; j++) {
          if (j === i) continue;
          const b = flies[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const w = Math.exp(-(dx * dx + dy * dy) / (2 * 110 * 110)) + 0.08;
          s += w * Math.sin(b.th - a.th);
          wsum += w;
        }
        dth[i] = omega * a.w + (wsum > 0 ? coupling * s / wsum : 0) + (Math.random() - 0.5) * 0.15;
        sx += Math.cos(a.th); sy += Math.sin(a.th);
      }
      order = Math.sqrt(sx * sx + sy * sy) / n;
      for (let i = 0; i < n; i++) {
        const f = flies[i];
        f.th += dth[i] * dt;
        if (f.th > TAU) f.th -= TAU * Math.floor(f.th / TAU);
        // flash envelope at the start of every cycle
        const p = f.th / TAU, win = 0.2;
        const target = p < win ? Math.pow(Math.sin(Math.PI * p / win), 2) : 0;
        f.b += (target - f.b) * (1 - Math.exp(-dt * (target > f.b ? 30 : 7)));
        // drifting flight
        f.hd += dt * (0.9 * Math.sin(t * 0.31 + f.wob) + 0.6 * Math.sin(t * 0.73 + f.wob * 2.3));
        const sp = f.sp * (1 + f.kick);
        f.x += Math.cos(f.hd) * sp * dt;
        f.y += Math.sin(f.hd) * sp * 0.55 * dt;
        if (f.y < 70) f.hd += dt * 1.6 * Math.sign(Math.cos(f.hd) || 1);
        if (f.y < 40) f.y = 40;
        if (f.y > 190) f.y = 190;
        if (f.y > 178) f.hd -= dt * 1.6 * Math.sign(Math.cos(f.hd) || 1);
        if (f.x < -20) f.x += W + 40;
        if (f.x > W + 20) f.x -= W + 40;
        f.kick *= Math.exp(-dt * 0.9);
      }
      // once the swarm has flashed together for a while, it breaks up and starts over
      if (order > 0.92) lockedFor += dt; else lockedFor = Math.max(0, lockedFor - dt * 0.5);
      if (lockedFor > 16 || cycleAge > 75) scatter();
    }

    function render() {
      const n = cfg.count, g = cfg.glow;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.drawImage(bg, 0, 0);
      let tot = 0;
      for (let i = 0; i < n; i++) tot += flies[i].b * flies[i].z;
      const mean = tot / n;
      ambient += (mean - ambient) * 0.3;
      ctx.globalCompositeOperation = 'lighter';
      // whole meadow brightens when the swarm flashes together
      if (ambient > 0.01) {
        const ag = ctx.createRadialGradient(160, 140, 10, 160, 140, 260);
        ag.addColorStop(0, rgba(g, clamp(ambient * 0.55, 0, 0.6)));
        ag.addColorStop(1, rgba(g, clamp(ambient * 0.18, 0, 0.3)));
        ctx.fillStyle = ag;
        ctx.fillRect(0, 0, W, H);
      }
      for (let i = 0; i < n; i++) {
        const f = flies[i];
        const z = f.z;
        // faint body so a dark firefly is still a hint of motion
        const rb = 3 * z;
        ctx.fillStyle = rgba([g[0] * 0.5, g[1] * 0.5, g[2] * 0.3], 0.12);
        ctx.beginPath(); ctx.arc(f.x, f.y, rb, 0, TAU); ctx.fill();
        if (f.b < 0.01) continue;
        const r = (12 + 22 * f.b) * z;
        const gr = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
        gr.addColorStop(0, rgba([g[0] * 0.6 + 100, g[1] * 0.6 + 100, g[2] * 0.6 + 100], f.b * z));
        gr.addColorStop(0.18, rgba(g, 0.85 * f.b * z));
        gr.addColorStop(0.5, rgba(g, 0.28 * f.b * z));
        gr.addColorStop(1, rgba(g, 0));
        ctx.fillStyle = gr;
        ctx.fillRect(f.x - r, f.y - r, r * 2, r * 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
