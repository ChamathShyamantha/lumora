<head>
  <title>Beat Ripples</title>
  <meta description="Every beat launches a colorful shockwave ring from the center." />
  <meta publisher="Lumora" />
  <meta category="Party & Music" />
  <meta energy="lively" />
  <meta palette="rainbow" />
  <meta tags="audio,music,party" />
  <meta property="sensitivity" label="Sensitivity" type="number" min="1" max="100" default="50" />
  <meta property="colorMode" label="Color Mode" type="combobox" values="Rainbow,Warm,Cool,Single" default="Rainbow" />
  <meta property="color" label="Color" type="color" default="#00c8ff" tooltip="Used when Color Mode is Single" />
  <meta property="speed" label="Ring Speed" type="number" min="1" max="100" default="50" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const hexRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    function hsv(h, s, v) {
      h = (h - Math.floor(h)) * 6;
      const i = h | 0, f = h - i, p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
      switch (i) {
        case 0: return [v, t, p];
        case 1: return [q, v, p];
        case 2: return [p, v, t];
        case 3: return [p, q, v];
        case 4: return [t, p, v];
        default: return [v, p, q];
      }
    }
    const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    function getAudio() {
      if (typeof engine === 'undefined' || !engine || !engine.audio || !engine.audio.active) return null;
      return engine.audio;
    }

    const MAX_R = 215;
    const cfg = { sens: 50, colorMode: 'Rainbow', rgb: [0, 200, 255], speed: 50 };
    const rings = [];
    let counter = 0, lastBeat = null, cooldown = 0, quiet = 10, idleTimer = 0.5, prevBass = 0, glow = 0, lastColor = [0, 200, 255];

    function readProps() {
      cfg.sens = clamp(num(get(() => sensitivity), 50), 1, 100);
      cfg.colorMode = String(get(() => colorMode, 'Rainbow'));
      cfg.rgb = hexRgb(get(() => color, '#00c8ff'), '#00c8ff');
      cfg.speed = clamp(num(get(() => speed), 50), 0, 100);
    }
    function onsensitivityChanged() { readProps(); }
    function oncolorModeChanged() { readProps(); }
    function oncolorChanged() { readProps(); }
    function onspeedChanged() { readProps(); }

    function pickColor(n) {
      let h;
      switch (cfg.colorMode) {
        case 'Single': return cfg.rgb.slice();
        case 'Warm': h = hsv(((n * 0.037) % 0.14) - 0.02, 1, 1); break;
        case 'Cool': h = hsv(0.45 + (Math.sin(n * 0.9) * 0.5 + 0.5) * 0.35, 1, 1); break;
        default: h = hsv(n * 0.113, 1, 1);
      }
      return [h[0] * 255, h[1] * 255, h[2] * 255];
    }

    function spawn(strength) {
      if (rings.length >= 24) rings.shift();
      const c = pickColor(counter++);
      rings.push({ r: 0, s: clamp(strength, 0.2, 1), c });
      lastColor = c;
      cooldown = 0.12;
    }

    function update(dt) {
      const a = getAudio();
      const gain = 0.3 + cfg.sens / 50 * 1.2;
      let bass = 0, beat = false;
      if (a) {
        bass = clamp(num(a.bass, 0) * gain, 0, 1);
        const bc = num(a.beatCount, 0);
        beat = a.beat === true || (lastBeat !== null && bc !== lastBeat);
        lastBeat = bc;
      }
      cooldown -= dt;
      const signal = !!a && (bass > 0.01 || num(a.level, 0) > 0.003);
      quiet = signal ? 0 : quiet + dt;
      if (signal) {
        // engine beats, plus our own onset detection scaled by sensitivity
        const onset = bass > 0.55 && bass > prevBass * 1.3 + 0.05;
        if ((beat || onset) && cooldown <= 0) spawn(0.45 + bass * 0.55);
      } else if (quiet > 1) {
        idleTimer -= dt;
        if (idleTimer <= 0) { spawn(0.85); idleTimer = 1.6; }
      }
      prevBass = bass;
      const v = 90 + cfg.speed * 3;
      for (let i = rings.length - 1; i >= 0; i--) {
        rings[i].r += v * dt;
        if (rings[i].r > MAX_R) rings.splice(i, 1);
      }
      const gl = signal ? bass : 0.15;
      glow += (gl - glow) * (1 - Math.exp(-dt * 8));
    }

    function render() {
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      if (glow > 0.01) {
        const g = ctx.createRadialGradient(160, 100, 0, 160, 100, 70);
        g.addColorStop(0, rgba(lastColor, glow * 0.6));
        g.addColorStop(1, rgba(lastColor, 0));
        ctx.fillStyle = g;
        ctx.fillRect(90, 30, 140, 140);
      }
      for (const ring of rings) {
        const life = ring.r / MAX_R;
        const a = ring.s * Math.pow(1 - life, 1.2);
        if (a < 0.01) continue;
        const w = 10 + ring.s * 14 + ring.r * 0.05;
        const inner = Math.max(0, ring.r - w), outer = ring.r + w;
        const g = ctx.createRadialGradient(160, 100, inner, 160, 100, outer);
        g.addColorStop(0, rgba(ring.c, 0));
        g.addColorStop(0.5, rgba(ring.c, a));
        g.addColorStop(1, rgba(ring.c, 0));
        ctx.fillStyle = g;
        ctx.fillRect(160 - outer, 100 - outer, outer * 2, outer * 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
