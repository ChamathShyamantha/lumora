<head>
  <title>Pulsar Beacon</title>
  <meta description="A spinning neutron star sweeps twin searchlight beams through cosmic dust, flashing a ripple of light every time a beam swings past." />
  <meta publisher="Lumora" />
  <meta category="Space" />
  <meta energy="lively" />
  <meta palette="cool" />
  <meta tags="space,pulsar,neutron star,beam,lighthouse,sweep,rotation,pulse" />
  <meta property="rotationSpeed" label="Rotation Speed" type="number" min="1" max="100" default="35" tooltip="How fast the beams sweep around" />
  <meta property="beamWidth" label="Beam Width" type="number" min="1" max="100" default="50" />
  <meta property="beamColor" label="Beam Color" type="color" default="#4fc4ff" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200, LW = 80, LH = 50, S = W / LW, CX = 160, CY = 100;
    const read = (f, d) => { try { const v = f(); return v === undefined || v === null || v === '' ? d : v; } catch (e) { return d; } };
    const numIn = (v, d, lo, hi) => { const n = Number(v); return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
    const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
    const toRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const css = (c, a) => 'rgba(' + (Math.min(255, Math.max(0, c[0])) | 0) + ',' + (Math.min(255, Math.max(0, c[1])) | 0) + ',' + (Math.min(255, Math.max(0, c[2])) | 0) + ',' + clamp01(a).toFixed(3) + ')';
    const TAU = Math.PI * 2;

    let seed = 7321;
    const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const PERM = new Uint16Array(512), VAL = new Float32Array(256);
    for (let i = 0; i < 256; i++) { PERM[i] = i; VAL[i] = rand(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); const s = PERM[i]; PERM[i] = PERM[j]; PERM[j] = s; }
    for (let i = 0; i < 256; i++) PERM[i + 256] = PERM[i];
    function noise(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      let fx = x - xi, fy = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = VAL[PERM[PERM[X] + Y]], b = VAL[PERM[PERM[X + 1] + Y]];
      const c = VAL[PERM[PERM[X] + Y + 1]], d = VAL[PERM[PERM[X + 1] + Y + 1]];
      fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
    }
    const fbm = (x, y) => (noise(x, y) * 0.57 + noise(x * 2.1 + 5.3, y * 2.1 + 1.7) * 0.29 + noise(x * 4.3 + 9.1, y * 4.3 + 3.3) * 0.14);

    const cfg = { spin: 35, width: 50, rgb: [79, 196, 255] };
    function readProps() {
      cfg.spin = numIn(read(() => rotationSpeed, 35), 35, 0, 100);
      cfg.width = numIn(read(() => beamWidth, 50), 50, 1, 100);
      cfg.rgb = toRgb(read(() => beamColor, '#4fc4ff'), '4fc4ff');
    }
    function onrotationSpeedChanged() { readProps(); }
    function onbeamWidthChanged() { readProps(); }
    function onbeamColorChanged() { readProps(); }

    const buf = document.createElement('canvas');
    buf.width = LW; buf.height = LH;
    const bctx = buf.getContext('2d');
    const img = bctx.createImageData(LW, LH);
    const px = img.data;

    // static dust field (precomputed) and per-pixel polar coordinates
    const N = LW * LH;
    const rad = new Float32Array(N), ang = new Float32Array(N);
    for (let j = 0; j < LH; j++) {
      for (let i = 0; i < LW; i++) {
        const k = j * LW + i, x = (i + 0.5) * S - CX, y = (j + 0.5) * S - CY;
        rad[k] = Math.sqrt(x * x + y * y);
        ang[k] = Math.atan2(y, x);
      }
    }
    const stars = [];
    for (let i = 0; i < 46; i++) stars.push({ x: rand() * W, y: rand() * H, r: 1 + rand() * 2.2, ph: rand() * TAU, sp: 0.6 + rand() * 1.8 });

    let theta = 0, clock = 0, pulse = 0, last = null;
    const rings = [];

    function renderBeams() {
      const c = cfg.rgb;
      const w = 0.06 + cfg.width * 0.0042;
      const curl = 0.0022 + cfg.spin * 0.00004;
      const flash = 1 + pulse * 0.9;
      // gentle drift of the dust so the glow never looks frozen
      const dx = clock * 0.035, dy = clock * 0.012;
      let o = 0, k = 0;
      for (let j = 0; j < LH; j++) for (let i = 0; i < LW; i++, k++) {
        const r = rad[k];
        let d = ang[k] - (theta - r * curl);
        d = d - Math.PI * Math.round(d / Math.PI); // twin beams: fold to [-pi/2, pi/2]
        const q = d / w;
        const core = Math.exp(-q * q);
        const soft = Math.exp(-q * q * 0.08);
        const fall = 0.4 + 0.6 * Math.exp(-r / 150);
        const du = fbm(i * 0.075 + dx, j * 0.075 + dy);
        const lit = (core * (0.55 + 0.9 * du) + soft * 0.22 * du) * fall * flash;
        const amb = 0.07 + 0.16 * du * du + 0.25 * Math.exp(-r / 60);
        const white = core * Math.exp(-r / 70) * 0.8;
        const v = lit + amb;
        px[o] = c[0] * v + 255 * white;
        px[o + 1] = c[1] * v + 255 * white;
        px[o + 2] = c[2] * v + 255 * white;
        px[o + 3] = 255;
        o += 4;
      }
      bctx.putImageData(img, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(buf, 0, 0, W, H);
    }

    function renderDetails() {
      const c = cfg.rgb;
      ctx.globalCompositeOperation = 'lighter';
      for (const s of stars) {
        const a = 0.35 + 0.3 * Math.sin(clock * s.sp + s.ph);
        const r = s.r * 2.4;
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
        g.addColorStop(0, 'rgba(235,245,255,' + a.toFixed(3) + ')');
        g.addColorStop(1, 'rgba(200,220,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(s.x - r, s.y - r, r * 2, r * 2);
      }
      for (const rg of rings) {
        const a = Math.max(0, 1 - rg.age / 1.6);
        if (a <= 0) continue;
        ctx.strokeStyle = css(c, 0.22 * a);
        ctx.lineWidth = 22;
        ctx.beginPath(); ctx.arc(CX, CY, Math.max(0, rg.r), 0, TAU); ctx.stroke();
        ctx.strokeStyle = css([c[0] * 0.5 + 128, c[1] * 0.5 + 128, c[2] * 0.5 + 128], 0.5 * a);
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(CX, CY, Math.max(0, rg.r), 0, TAU); ctx.stroke();
      }
      const cr = 40 + 34 * pulse;
      const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, cr);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.22, css([c[0] * 0.3 + 178, c[1] * 0.3 + 178, c[2] * 0.3 + 178], 0.95));
      g.addColorStop(0.5, css(c, 0.35 + 0.3 * pulse));
      g.addColorStop(1, css(c, 0));
      ctx.fillStyle = g;
      ctx.fillRect(CX - cr, CY - cr, cr * 2, cr * 2);
      ctx.globalCompositeOperation = 'source-over';
    }

    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      let dt = last === null ? 1 / 60 : (now - last) / 1000;
      last = now;
      if (!(dt >= 0)) dt = 0;
      if (dt > 0.1) dt = 0.1;
      readProps();
      clock += dt;
      const omega = 0.25 + cfg.spin * 0.045;
      const before = Math.floor((theta - Math.PI / 2) / Math.PI);
      theta += omega * dt;
      const after = Math.floor((theta - Math.PI / 2) / Math.PI);
      if (theta > 400 * Math.PI) theta -= 400 * Math.PI;
      // a beam swings through our line of sight: flash and send out a ripple
      if (after !== before) { pulse = 1; rings.push({ r: 12, age: 0 }); }
      pulse *= Math.exp(-dt * 3.5);
      for (let i = rings.length - 1; i >= 0; i--) {
        rings[i].age += dt; rings[i].r += dt * 150;
        if (rings[i].age > 1.6) rings.splice(i, 1);
      }
      if (rings.length > 8) rings.splice(0, rings.length - 8);
      renderBeams();
      renderDetails();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
