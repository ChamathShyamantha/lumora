<head>
  <title>Aurora</title>
  <meta description="Flowing curtains of northern light rippling across a dark sky." />
  <meta publisher="Lumora" />
  <meta category="Nature" />
  <meta energy="calm" />
  <meta palette="cool" />
  <meta tags="nature,calm,ambient" />
  <meta property="color1" label="Lower Color" type="color" default="#00ff88" />
  <meta property="color2" label="Upper Color" type="color" default="#8a2bff" />
  <meta property="speed" label="Speed" type="number" min="1" max="100" default="30" />
  <meta property="intensity" label="Intensity" type="number" min="1" max="100" default="70" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const hexRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    function buffer(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      const img = x.createImageData(w, h);
      return { c, x, img, d: img.data, w, h };
    }
    function present(b) {
      b.x.putImageData(b.img, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(b.c, 0, 0, W, H);
    }

    const B = buffer(80, 50);
    const LAYERS = [
      { base: 150, height: 70, amp: 1.0 },
      { base: 112, height: 52, amp: 0.75 },
      { base: 80, height: 40, amp: 0.55 }
    ];
    const edge = LAYERS.map(() => new Float32Array(B.w));
    const ray = LAYERS.map(() => new Float32Array(B.w));
    const cfg = { c1: [0, 255, 136], c2: [138, 43, 255], speed: 30, intensity: 70 };
    let t = 0;

    function readProps() {
      cfg.c1 = hexRgb(get(() => color1, '#00ff88'), '#00ff88');
      cfg.c2 = hexRgb(get(() => color2, '#8a2bff'), '#8a2bff');
      cfg.speed = clamp(num(get(() => speed), 30), 0, 100);
      cfg.intensity = clamp(num(get(() => intensity), 70), 1, 100);
    }
    function oncolor1Changed() { readProps(); }
    function oncolor2Changed() { readProps(); }
    function onspeedChanged() { readProps(); }
    function onintensityChanged() { readProps(); }

    function update(dt) {
      t += dt * (0.05 + cfg.speed * 0.02);
      if (t > 1e5) t = 0;
    }

    function render() {
      const bw = B.w, bh = B.h, sx = W / bw, sy = H / bh, d = B.d;
      // Per-column curtain shape for every layer.
      for (let k = 0; k < LAYERS.length; k++) {
        const L = LAYERS[k], e = edge[k], r = ray[k];
        const pulse = L.amp * (0.75 + 0.25 * Math.sin(t * 0.3 + k * 1.9));
        for (let i = 0; i < bw; i++) {
          const x = (i + 0.5) * sx;
          e[i] = L.base + 22 * Math.sin(x * 0.012 + t * 0.5 + k * 2.1) + 10 * Math.sin(x * 0.031 - t * 0.8 + k * 1.3);
          const s = 0.5 + 0.5 * Math.sin(x * 0.09 + t * 1.1 + k * 4 + 1.5 * Math.sin(x * 0.021 - t * 0.6 + k));
          r[i] = pulse * (0.3 + 0.7 * s * s);
        }
      }
      const gain = (0.35 + cfg.intensity / 100) * 1.1;
      const c1 = cfg.c1, c2 = cfg.c2;
      let o = 0;
      for (let j = 0; j < bh; j++) {
        const y = (j + 0.5) * sy;
        for (let i = 0; i < bw; i++, o += 4) {
          let R = 0, G = 0, Bl = 0;
          for (let k = 0; k < LAYERS.length; k++) {
            const dd = edge[k][i] - y; // distance above the curtain's lower edge
            const hgt = LAYERS[k].height;
            let p;
            if (dd < 0) p = Math.exp(dd / 6);
            else p = Math.exp(-dd / hgt);
            if (p < 0.004) continue;
            const a = p * ray[k][i];
            const m = clamp(dd / (hgt * 1.2), 0, 1);
            R += (c1[0] + (c2[0] - c1[0]) * m) * a;
            G += (c1[1] + (c2[1] - c1[1]) * m) * a;
            Bl += (c1[2] + (c2[2] - c1[2]) * m) * a;
          }
          d[o] = R * gain; d[o + 1] = G * gain; d[o + 2] = Bl * gain; d[o + 3] = 255;
        }
      }
      present(B);
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
