<head>
  <title>Cherry Blossom Wind</title>
  <meta description="Soft pink petals tumble and swirl on spring gusts across a gentle pastel sky." />
  <meta publisher="Lumora" />
  <meta category="Nature" />
  <meta energy="calm" />
  <meta palette="pastel" />
  <meta tags="nature,spring,sakura,cherry,blossom,petals,wind,pink,pastel,japan,calm,soft" />
  <meta property="petalColor" label="Petal Color" type="color" default="#ffa8cc" />
  <meta property="windStrength" label="Wind Strength" type="number" min="0" max="100" default="50" />
  <meta property="petalCount" label="Petals" type="number" min="10" max="150" default="70" />
  <meta property="sky" label="Sky" type="combobox" values="Dawn,Day,Dusk" default="Dawn" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200, TAU = Math.PI * 2;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const fin = (v) => (isFinite(v) ? v : 0);
    const hexRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const rgba = (c, a) => 'rgba(' + (clamp(fin(c[0]), 0, 255) | 0) + ',' + (clamp(fin(c[1]), 0, 255) | 0) + ',' + (clamp(fin(c[2]), 0, 255) | 0) + ',' + clamp(fin(a), 0, 1).toFixed(3) + ')';
    const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];

    const SKIES = {
      Dawn: { top: [120, 130, 205], mid: [205, 160, 205], low: [255, 200, 185], haze: [255, 225, 200] },
      Day: { top: [90, 165, 235], mid: [150, 200, 240], low: [215, 235, 250], haze: [255, 255, 255] },
      Dusk: { top: [52, 44, 110], mid: [150, 80, 140], low: [245, 140, 120], haze: [255, 180, 140] }
    };
    const cfg = { petal: [255, 168, 204], wind: 50, count: 70, sky: 'Dawn' };
    const MAXP = 150;
    const petals = [];
    let t = 0, gustX = -200, gustAmp = 0, nextGust = 2, gustDir = 1;

    // sky backdrop
    const bg = document.createElement('canvas');
    bg.width = W; bg.height = H;
    const bgx = bg.getContext('2d');
    let bgKey = '';
    function buildBg() {
      const s = SKIES[cfg.sky] || SKIES.Dawn;
      const p = cfg.petal;
      const g = bgx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, rgba(s.top, 1));
      g.addColorStop(0.55, rgba(s.mid, 1));
      g.addColorStop(1, rgba(s.low, 1));
      bgx.fillStyle = g;
      bgx.fillRect(0, 0, W, H);
      // soft, out-of-focus blossom clouds at the edges of the view
      const blobs = [[-10, 20, 110], [40, -20, 80], [330, 30, 100], [290, 190, 90], [-20, 200, 80]];
      for (const b of blobs) {
        const r = bgx.createRadialGradient(b[0], b[1], 0, b[0], b[1], b[2]);
        r.addColorStop(0, rgba(mix(p, [255, 255, 255], 0.25), 0.75));
        r.addColorStop(0.6, rgba(p, 0.3));
        r.addColorStop(1, rgba(p, 0));
        bgx.fillStyle = r;
        bgx.fillRect(0, 0, W, H);
      }
      bgKey = cfg.sky + '|' + p.join(',');
    }

    // one pre-rendered petal sprite (halo + petal), rebuilt on colour change
    const SP = 48;
    const sprite = document.createElement('canvas');
    sprite.width = SP; sprite.height = SP;
    const spx = sprite.getContext('2d');
    function buildSprite() {
      const p = cfg.petal, c = SP / 2;
      spx.clearRect(0, 0, SP, SP);
      const halo = spx.createRadialGradient(c, c, 0, c, c, c);
      halo.addColorStop(0, rgba(p, 0.55));
      halo.addColorStop(0.4, rgba(p, 0.22));
      halo.addColorStop(1, rgba(p, 0));
      spx.fillStyle = halo;
      spx.fillRect(0, 0, SP, SP);
      // petal: teardrop with a notch at the tip
      spx.save();
      spx.translate(c, c);
      const body = spx.createLinearGradient(-11, 0, 11, 0);
      body.addColorStop(0, rgba(mix(p, [255, 255, 255], 0.55), 1));
      body.addColorStop(0.6, rgba(p, 1));
      body.addColorStop(1, rgba(mix(p, [200, 60, 120], 0.25), 1));
      spx.fillStyle = body;
      spx.beginPath();
      spx.moveTo(-11, 0);
      spx.bezierCurveTo(-8, -9, 6, -9, 11, -3);
      spx.lineTo(8, 0);
      spx.lineTo(11, 3);
      spx.bezierCurveTo(6, 9, -8, 9, -11, 0);
      spx.closePath();
      spx.fill();
      spx.restore();
    }

    function newPetal(p, anywhere) {
      p = p || {};
      p.z = 0.55 + Math.random() * 0.9;                 // depth: size, speed, softness
      p.x = anywhere ? Math.random() * W : -30 - Math.random() * 60;
      p.y = anywhere ? Math.random() * H : Math.random() * H * 0.9 - 20;
      if (!anywhere && Math.random() < 0.35) { p.x = Math.random() * W; p.y = -25; }
      p.vx = 20; p.vy = 10;
      p.rot = Math.random() * TAU;
      p.spin = (Math.random() - 0.5) * 3;
      p.flip = Math.random() * TAU;
      p.flipRate = 1.5 + Math.random() * 3;
      p.ph = Math.random() * 100;
      return p;
    }
    for (let i = 0; i < MAXP; i++) petals.push(newPetal(null, true));

    function readProps() {
      cfg.petal = hexRgb(get(() => petalColor, '#ffa8cc'), '#ffa8cc');
      cfg.wind = clamp(num(get(() => windStrength), 50), 0, 100);
      cfg.count = Math.round(clamp(num(get(() => petalCount), 70), 10, MAXP));
      const s = String(get(() => sky, 'Dawn'));
      cfg.sky = SKIES[s] ? s : 'Dawn';
      const key = cfg.sky + '|' + cfg.petal.join(',');
      if (key !== bgKey) { buildBg(); buildSprite(); }
    }
    function onpetalColorChanged() { readProps(); }
    function onwindStrengthChanged() { readProps(); }
    function onpetalCountChanged() { readProps(); }
    function onskyChanged() { readProps(); }

    function windAt(x, y) {
      const w = cfg.wind / 100;
      const g = gustAmp * Math.exp(-Math.pow((x - gustX) / 85, 2));
      // gentle swirls riding on the breeze
      const u = 10 + w * 34 + g * 1.0 + 16 * Math.sin(y * 0.028 + t * 0.7) * (0.4 + w);
      const v = 9 + 12 * Math.cos(x * 0.022 - t * 0.55) * (0.5 + w) - g * 0.35 * Math.sin(y * 0.03 + t);
      return [u, v, g];
    }

    function update(dt) {
      t += dt;
      if (t > 1e5) t = 0;
      const w = cfg.wind / 100;
      // gusts sweep across the scene from left to right
      nextGust -= dt;
      if (nextGust <= 0) {
        gustX = -120;
        gustAmp = (40 + Math.random() * 60) * (0.3 + w * 1.4);
        nextGust = 5 + Math.random() * 7 - w * 3;
      }
      gustX += dt * (110 + w * 120);
      if (gustX > W + 200) gustAmp *= Math.exp(-dt * 2);
      for (let i = 0; i < cfg.count; i++) {
        const p = petals[i];
        const f = windAt(p.x, p.y);
        const drag = 1.2 + 0.4 * Math.sin(p.flip);              // flat side catches more wind
        p.vx += (f[0] * p.z - p.vx) * (1 - Math.exp(-dt * drag));
        p.vy += (f[1] * p.z - p.vy) * (1 - Math.exp(-dt * drag));
        p.x += p.vx * dt; p.y += p.vy * dt;
        const tumble = 1 + f[2] * 0.03;
        p.rot += p.spin * tumble * dt;
        p.flip += p.flipRate * tumble * dt;
        if (p.x > W + 30 || p.y > H + 30 || p.y < -60 || p.x < -140) newPetal(p, false);
      }
    }

    function render() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.drawImage(bg, 0, 0);
      const s = SKIES[cfg.sky] || SKIES.Dawn;
      // the gust shows as a faint warm brightening sweeping through
      if (gustAmp > 1) {
        const a = clamp(gustAmp / 160, 0, 0.35);
        const gx = clamp(gustX, -400, 800);
        const g = ctx.createLinearGradient(gx - 110, 0, gx + 110, 0);
        g.addColorStop(0, rgba(s.haze, 0));
        g.addColorStop(0.5, rgba(s.haze, a));
        g.addColorStop(1, rgba(s.haze, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
      // far petals first
      const order = [];
      for (let i = 0; i < cfg.count; i++) order.push(i);
      order.sort((a, b) => petals[a].z - petals[b].z);
      for (const i of order) {
        const p = petals[i];
        const sz = 0.55 + p.z * 0.75;
        const squash = 0.25 + 0.75 * Math.abs(Math.cos(p.flip));
        ctx.globalAlpha = clamp(0.55 + p.z * 0.35, 0, 1);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(sz, sz * squash);
        ctx.drawImage(sprite, -SP / 2, -SP / 2);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
