<head>
  <title>Twinkle Stars</title>
  <meta description="Soft points of light that fade in and out like a starry night." />
  <meta publisher="Lumora" />
  <meta category="Space" />
  <meta energy="calm" />
  <meta palette="cool" />
  <meta tags="calm,night,sparkle" />
  <meta property="density" label="Density" type="number" min="1" max="100" default="50" />
  <meta property="twinkleSpeed" label="Twinkle Speed" type="number" min="1" max="100" default="40" />
  <meta property="rainbow" label="Rainbow" type="boolean" default="0" />
  <meta property="starColor" label="Star Color" type="color" default="#ffe2a8" />
  <meta property="bgColor" label="Background Color" type="color" default="#000000" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const bool = (v, d) => (v === undefined || v === null ? d : v === true || v === 1 || v === '1' || v === 'true');
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const hexRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    function hsv(h, s, v) {
      h = (h - Math.floor(h)) * 6;
      const i = h | 0, f = h - i, p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
      switch (i) {
        case 0: return [v, t, p];
        case 1: return [q, v, p];
        case 2: return [p, v, t];
        case 3: return [p, q, v];
        case 4: return [t, p, v];
        default: return [v, p, q];
      }
    }
    const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + clamp(a, 0, 1).toFixed(3) + ')';

    const cfg = { density: 50, speed: 40, rainbow: false, star: [255, 226, 168], bg: '#000000' };
    const stars = [];
    let t = 0;

    function readProps() {
      cfg.density = clamp(num(get(() => density), 50), 1, 100);
      cfg.speed = clamp(num(get(() => twinkleSpeed), 40), 0, 100);
      cfg.rainbow = bool(get(() => rainbow), false);
      cfg.star = hexRgb(get(() => starColor, '#ffe2a8'), '#ffe2a8');
      const bg = hexRgb(get(() => bgColor, '#000000'), '#000000');
      cfg.bg = 'rgb(' + bg[0] + ',' + bg[1] + ',' + bg[2] + ')';
    }
    function ondensityChanged() { readProps(); }
    function ontwinkleSpeedChanged() { readProps(); }
    function onrainbowChanged() { readProps(); }
    function onstarColorChanged() { readProps(); }
    function onbgColorChanged() { readProps(); }

    function spawn(s, initial) {
      s.x = Math.random() * W;
      s.y = Math.random() * H;
      s.life = initial ? Math.random() : 0;
      s.dur = 1.6 + Math.random() * 2.8;
      s.size = 12 + Math.random() * 16;
      s.hue = Math.random();
      s.seed = Math.random() * 100;
      return s;
    }

    function update(dt) {
      t += dt;
      const want = Math.round(6 + cfg.density * 0.54);
      while (stars.length < want) stars.push(spawn({}, true));
      if (stars.length > want) stars.length = want;
      const k = 0.2 + cfg.speed / 40 * 0.8;
      for (const s of stars) {
        s.life += dt * k / s.dur;
        if (s.life >= 1) spawn(s, false);
      }
    }

    function render() {
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = cfg.bg;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for (const s of stars) {
        const e = Math.sin(Math.PI * s.life);
        const a = e * e * (0.88 + 0.12 * Math.sin(t * 9 + s.seed));
        if (a < 0.01) continue;
        let c;
        if (cfg.rainbow) { const h = hsv(s.hue, 0.85, 1); c = [h[0] * 255, h[1] * 255, h[2] * 255]; }
        else c = cfg.star;
        const r = s.size * (0.75 + 0.25 * e);
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
        g.addColorStop(0, rgba(c, a));
        g.addColorStop(0.3, rgba(c, a * 0.6));
        g.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = g;
        ctx.fillRect(s.x - r, s.y - r, r * 2, r * 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
