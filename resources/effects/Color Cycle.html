<head>
  <title>Color Cycle</title>
  <meta description="Your whole setup glides smoothly through every hue." />
  <meta publisher="Lumora" />
  <meta category="Classic" />
  <meta energy="calm" />
  <meta palette="rainbow" />
  <meta tags="rainbow,calm,simple" />
  <meta property="speed" label="Speed" type="number" min="1" max="100" default="30" />
  <meta property="saturation" label="Saturation" type="number" min="0" max="100" default="100" />
  <meta property="brightness" label="Brightness" type="number" min="0" max="100" default="100" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    function hsv(h, s, v) {
      h = (h - Math.floor(h)) * 6;
      const i = h | 0, f = h - i, p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
      switch (i) {
        case 0: return [v, t, p];
        case 1: return [q, v, p];
        case 2: return [p, v, t];
        case 3: return [p, q, v];
        case 4: return [t, p, v];
        default: return [v, p, q];
      }
    }

    const cfg = { speed: 30, saturation: 100, brightness: 100 };
    let hue = 0;

    function readProps() {
      cfg.speed = clamp(num(get(() => speed), 30), 0, 100);
      cfg.saturation = clamp(num(get(() => saturation), 100), 0, 100);
      cfg.brightness = clamp(num(get(() => brightness), 100), 0, 100);
    }
    function onspeedChanged() { readProps(); }
    function onsaturationChanged() { readProps(); render(); }
    function onbrightnessChanged() { readProps(); render(); }

    function update(dt) {
      hue += dt * (0.005 + cfg.speed * 0.0025); // cycles per second
      hue -= Math.floor(hue);
    }

    function render() {
      const c = hsv(hue, cfg.saturation / 100, cfg.brightness / 100);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgb(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
