<head>
  <title>Orbital Dance</title>
  <meta description="Glowing worlds loop and slingshot around a pair of twin suns, painting the dark with fading ribbons of neon light." />
  <meta publisher="Lumora" />
  <meta category="Space" />
  <meta energy="lively" />
  <meta palette="neon" />
  <meta tags="space,orbit,gravity,planets,trails,binary star,physics,neon,motion" />
  <meta property="bodyCount" label="Body Count" type="number" min="2" max="12" default="6" />
  <meta property="trailLength" label="Trail Length" type="number" min="1" max="100" default="55" />
  <meta property="speed" label="Speed" type="number" min="1" max="100" default="45" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200, LW = 160, LH = 100, S = W / LW, CX = 160, CY = 100;
    const read = (f, d) => { try { const v = f(); return v === undefined || v === null || v === '' ? d : v; } catch (e) { return d; } };
    const numIn = (v, d, lo, hi) => { const n = Number(v); return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
    const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
    function hueRgb(h) {
      h = (h - Math.floor(h)) * 6;
      return [clamp01(Math.abs(h - 3) - 1), clamp01(2 - Math.abs(h - 2)), clamp01(2 - Math.abs(h - 4))];
    }

    const cfg = { count: 6, trail: 55, speed: 45 };
    function readProps() {
      cfg.count = Math.round(numIn(read(() => bodyCount, 6), 6, 2, 12));
      cfg.trail = numIn(read(() => trailLength, 55), 55, 1, 100);
      cfg.speed = numIn(read(() => speed, 45), 45, 0, 100);
    }
    function onbodyCountChanged() { readProps(); }
    function ontrailLengthChanged() { readProps(); }
    function onspeedChanged() { readProps(); }

    // ---- gravity --------------------------------------------------------------
    const GM = 330000, SOFT2 = 16 * 16, SUN_ORBIT = 34;
    const suns = [{ x: 0, y: 0, hue: 0.53 }, { x: 0, y: 0, hue: 0.86 }];
    let sunAngle = 0;
    function placeSuns() {
      const c = Math.cos(sunAngle), s = Math.sin(sunAngle);
      suns[0].x = c * SUN_ORBIT * 1.3; suns[0].y = s * SUN_ORBIT * 0.75;
      suns[1].x = -suns[0].x; suns[1].y = -suns[0].y;
    }
    placeSuns();

    const bodies = [];
    function spawn(b, idx) {
      const r = 62 + Math.random() * 50;
      const a = Math.random() * Math.PI * 2;
      const dir = Math.random() < 0.8 ? 1 : -1;
      const v = Math.sqrt(2 * GM / r) * (0.88 + Math.random() * 0.16);
      b.x = Math.cos(a) * r * 1.25; b.y = Math.sin(a) * r * 0.8;
      b.vx = -Math.sin(a) * v * dir * 1.1; b.vy = Math.cos(a) * v * dir * 0.85;
      b.fade = 0;
      b.idx = idx;
      return b;
    }
    function accel(x, y, out) {
      let ax = 0, ay = 0, pot = 0;
      for (const s of suns) {
        const dx = s.x - x, dy = s.y - y;
        const d2 = dx * dx + dy * dy + SOFT2;
        const inv = 1 / Math.sqrt(d2);
        const f = GM * inv * inv * inv;
        ax += dx * f; ay += dy * f; pot -= GM * inv;
      }
      out[0] = ax; out[1] = ay; out[2] = pot;
    }

    // ---- trail field (float RGB, decays smoothly at any frame rate) -----------
    const N = LW * LH;
    const field = new Float32Array(N * 3);
    const buf = document.createElement('canvas');
    buf.width = LW; buf.height = LH;
    const bctx = buf.getContext('2d');
    const img = bctx.createImageData(LW, LH);
    const px = img.data;
    const KER = [];
    for (let j = -3; j <= 3; j++) for (let i = -3; i <= 3; i++) { const w = Math.exp(-(i * i + j * j) / 2.6); if (w > 0.02) KER.push(i, j, w); }
    function splat(x, y, c, amt) {
      const fx = (x + CX) / S, fy = (y + CY) / S;
      const ix = Math.round(fx), iy = Math.round(fy);
      for (let k = 0; k < KER.length; k += 3) {
        const X = ix + KER[k], Y = iy + KER[k + 1];
        if (X < 0 || Y < 0 || X >= LW || Y >= LH) continue;
        const w = KER[k + 2] * amt, o = (Y * LW + X) * 3;
        field[o] += c[0] * w; field[o + 1] += c[1] * w; field[o + 2] += c[2] * w;
      }
    }

    const acc = [0, 0, 0];
    let clock = 0, last = null;
    function simulate(dt) {
      const want = cfg.count;
      while (bodies.length < want) bodies.push(spawn({}, bodies.length));
      if (bodies.length > want) bodies.length = want;
      const scale = 0.25 + cfg.speed * 0.02;
      const T = dt * scale;
      const steps = Math.max(1, Math.min(40, Math.ceil(T / 0.004)));
      const h = T / steps;
      for (let s = 0; s < steps; s++) {
        sunAngle += h * 0.55;
        placeSuns();
        for (const b of bodies) {
          // leapfrog (kick-drift-kick) keeps the orbits well behaved
          accel(b.x, b.y, acc);
          b.vx += acc[0] * h * 0.5; b.vy += acc[1] * h * 0.5;
          b.x += b.vx * h; b.y += b.vy * h;
          accel(b.x, b.y, acc);
          b.vx += acc[0] * h * 0.5; b.vy += acc[1] * h * 0.5;
          // keep everyone bound: bleed energy if heading for escape, pull back stragglers
          const e = 0.5 * (b.vx * b.vx + b.vy * b.vy) + acc[2];
          if (e > -GM / 260) { b.vx *= 1 - 0.8 * h; b.vy *= 1 - 0.8 * h; }
          const ex = b.x / 150, ey = b.y / 92, out = ex * ex + ey * ey;
          if (out > 1) { b.vx -= b.x * (out - 1) * 6 * h; b.vy -= b.y * (out - 1) * 6 * h; }
          const sp = Math.hypot(b.vx, b.vy);
          if (!isFinite(sp) || out > 4) spawn(b, b.idx);
          else if (sp > 900) { b.vx *= 900 / sp; b.vy *= 900 / sp; }
        }
      }
      // paint trails once per frame along each body's path
      for (const b of bodies) {
        b.fade = Math.min(1, b.fade + dt * 1.5);
        const c = hueRgb(b.idx / Math.max(2, cfg.count) + clock * 0.02);
        if (b.px === undefined) { b.px = b.x; b.py = b.y; }
        let dist = Math.hypot(b.x - b.px, b.y - b.py);
        if (dist > 120) { b.px = b.x; b.py = b.y; dist = 0; }
        const segs = Math.max(1, Math.min(24, Math.ceil(dist / 2.5)));
        const amt = (dist * 0.06 + dt * 10) * b.fade / segs * Math.min(1, 2.45 / Math.sqrt(cfg.count));
        for (let k = 1; k <= segs; k++) {
          const t = k / segs;
          splat(b.px + (b.x - b.px) * t, b.py + (b.y - b.py) * t, c, amt);
        }
        b.px = b.x; b.py = b.y;
      }
    }

    function render(dt) {
      const tau = 0.25 + cfg.trail * 0.045;
      const keep = Math.exp(-dt / tau);
      let o = 0;
      for (let k = 0; k < N; k++) {
        const r = field[k * 3] *= keep, g = field[k * 3 + 1] *= keep, b = field[k * 3 + 2] *= keep;
        px[o] = 14 + 241 * (1 - Math.exp(-r * 1.6));
        px[o + 1] = 4 + 251 * (1 - Math.exp(-g * 1.6));
        px[o + 2] = 30 + 225 * (1 - Math.exp(-b * 1.6));
        px[o + 3] = 255;
        o += 4;
      }
      bctx.putImageData(img, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(buf, 0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for (const s of suns) {
        const c = hueRgb(s.hue + clock * 0.01);
        const x = CX + s.x, y = CY + s.y, rr = 46;
        const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
        g.addColorStop(0, 'rgba(255,255,255,0.95)');
        g.addColorStop(0.15, 'rgba(' + (c[0] * 155 + 100 | 0) + ',' + (c[1] * 155 + 100 | 0) + ',' + (c[2] * 155 + 100 | 0) + ',0.7)');
        g.addColorStop(1, 'rgba(' + (c[0] * 255 | 0) + ',' + (c[1] * 255 | 0) + ',' + (c[2] * 255 | 0) + ',0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - rr, y - rr, rr * 2, rr * 2);
      }
      for (const b of bodies) {
        const c = hueRgb(b.idx / Math.max(2, cfg.count) + clock * 0.02);
        const x = CX + b.x, y = CY + b.y, rr = 20;
        const a = b.fade;
        const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
        g.addColorStop(0, 'rgba(255,255,255,' + (0.95 * a).toFixed(3) + ')');
        g.addColorStop(0.2, 'rgba(' + (c[0] * 255 | 0) + ',' + (c[1] * 255 | 0) + ',' + (c[2] * 255 | 0) + ',' + (0.65 * a).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(' + (c[0] * 255 | 0) + ',' + (c[1] * 255 | 0) + ',' + (c[2] * 255 | 0) + ',0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - rr, y - rr, rr * 2, rr * 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      let dt = last === null ? 1 / 60 : (now - last) / 1000;
      last = now;
      if (!(dt >= 0)) dt = 0;
      if (dt > 0.1) dt = 0.1;
      readProps();
      clock += dt;
      simulate(dt);
      render(dt);
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
