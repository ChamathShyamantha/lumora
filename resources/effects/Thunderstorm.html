<head>
  <title>Thunderstorm</title>
  <meta description="Heavy clouds roll overhead through sheets of rain until a forked bolt tears down and floods the whole setup with light." />
  <meta publisher="Lumora" />
  <meta category="Nature" />
  <meta energy="intense" />
  <meta palette="cool" />
  <meta tags="nature,weather,storm,thunder,lightning,rain,clouds,flash,dark,night,dramatic" />
  <meta property="rain" label="Rain" type="number" min="0" max="100" default="60" />
  <meta property="lightning" label="Lightning Frequency" type="number" min="0" max="100" default="45" />
  <meta property="cloudColor" label="Cloud Color" type="color" default="#465a86" />
  <meta property="boltColor" label="Bolt Color" type="color" default="#c9d8ff" />
  <meta property="wind" label="Wind" tooltip="Cloud drift and rain slant" type="number" min="0" max="100" default="40" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const fin = (v) => (isFinite(v) ? v : 0);
    const smooth = (a, b, v) => { const x = clamp((v - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
    const hexRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const rgba = (c, a) => 'rgba(' + (clamp(fin(c[0]), 0, 255) | 0) + ',' + (clamp(fin(c[1]), 0, 255) | 0) + ',' + (clamp(fin(c[2]), 0, 255) | 0) + ',' + clamp(fin(a), 0, 1).toFixed(3) + ')';
    function buffer(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      const img = x.createImageData(w, h);
      return { c, x, img, d: img.data, w, h };
    }
    function present(b) {
      b.x.putImageData(b.img, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(b.c, 0, 0, W, H);
    }
    const PERM = new Uint8Array(512);
    (function () {
      const p = []; let s = 4242;
      for (let i = 0; i < 256; i++) p[i] = i;
      for (let i = 255; i > 0; i--) { s = (s * 16807) % 2147483647; const j = s % (i + 1); const tmp = p[i]; p[i] = p[j]; p[j] = tmp; }
      for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
    })();
    function vnoise(x, y) {
      let xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      xi &= 255; yi &= 255;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      const a = PERM[PERM[xi] + yi], b = PERM[PERM[xi + 1] + yi], c = PERM[PERM[xi] + yi + 1], d = PERM[PERM[xi + 1] + yi + 1];
      const top = a + (b - a) * u, bot = c + (d - c) * u;
      return (top + (bot - top) * v) / 255;
    }

    const BW = 80, BH = 50, SX = W / BW, SY = H / BH;
    const B = buffer(BW, BH);
    const cfg = { rain: 60, lightning: 45, cloud: [70, 90, 134], bolt: [201, 216, 255], wind: 40 };
    let t = 0, drift = 0;

    function readProps() {
      cfg.rain = clamp(num(get(() => rain), 60), 0, 100);
      cfg.lightning = clamp(num(get(() => lightning), 45), 0, 100);
      cfg.cloud = hexRgb(get(() => cloudColor, '#465a86'), '#465a86');
      cfg.bolt = hexRgb(get(() => boltColor, '#c9d8ff'), '#c9d8ff');
      cfg.wind = clamp(num(get(() => wind), 40), 0, 100);
    }
    function onrainChanged() { readProps(); }
    function onlightningChanged() { readProps(); }
    function oncloudColorChanged() { readProps(); }
    function onboltColorChanged() { readProps(); }
    function onwindChanged() { readProps(); }

    // ---------- rain ----------
    const MAXDROPS = 260;
    const drops = [];
    for (let i = 0; i < MAXDROPS; i++) drops.push({ x: Math.random() * W, y: Math.random() * H, v: 260 + Math.random() * 160, l: 10 + Math.random() * 14, a: 0.25 + Math.random() * 0.35 });

    // ---------- lightning ----------
    let bolt = null, nextStrike = 2.5;
    const LEVELS = [1, 0.55, 0.3025];
    let flash = 0;
    function makeBolt() {
      const segs = [];
      const sx = 40 + Math.random() * 240, sy = 8 + Math.random() * 30;
      const ex = sx + (Math.random() - 0.5) * 140, ey = H + 10;
      function branch(x1, y1, x2, y2, w, depth) {
        // midpoint displacement into a jagged polyline
        let pts = [[x1, y1], [x2, y2]];
        let off = Math.hypot(x2 - x1, y2 - y1) * 0.22;
        for (let k = 0; k < 5; k++) {
          const np = [pts[0]];
          for (let i = 0; i < pts.length - 1; i++) {
            const a = pts[i], b = pts[i + 1];
            np.push([(a[0] + b[0]) / 2 + (Math.random() - 0.5) * off, (a[1] + b[1]) / 2 + (Math.random() - 0.5) * off * 0.35], b);
          }
          pts = np; off *= 0.55;
        }
        for (let i = 0; i < pts.length - 1; i++) segs.push([pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], w]);
        if (depth < 2) {
          const nb = depth === 0 ? 3 + ((Math.random() * 3) | 0) : 1 + ((Math.random() * 2) | 0);
          for (let b = 0; b < nb; b++) {
            const p = pts[2 + ((Math.random() * (pts.length * 0.6)) | 0)];
            if (!p) continue;
            const len = (y2 - y1) * (0.25 + Math.random() * 0.3) / (depth + 1);
            const dir = Math.random() < 0.5 ? -1 : 1;
            branch(p[0], p[1], p[0] + dir * len * (0.4 + Math.random() * 0.7), p[1] + len, w * 0.55, depth + 1);
          }
        }
      }
      branch(sx, sy, ex, ey, 1, 0);
      // a few return strokes make the light stutter
      const strokes = [[0, 1]];
      let at = 0;
      const n = 1 + ((Math.random() * 3) | 0);
      for (let i = 0; i < n; i++) { at += 0.07 + Math.random() * 0.12; strokes.push([at, 0.45 + Math.random() * 0.5]); }
      return { segs, x: sx * 0.5 + ex * 0.5, age: 0, strokes };
    }
    function boltLight(b) {
      let v = 0;
      for (const s of b.strokes) if (b.age >= s[0]) v += s[1] * Math.exp(-(b.age - s[0]) / 0.09);
      return v;
    }

    function update(dt) {
      t += dt;
      if (t > 1e5) t = 0;
      const wf = cfg.wind / 100;
      drift += dt * (4 + wf * 26);
      if (drift > 1e5) drift = 0;
      // rain
      const nDrops = Math.round(cfg.rain / 100 * MAXDROPS);
      const slant = 0.1 + wf * 0.45;
      for (let i = 0; i < nDrops; i++) {
        const d = drops[i];
        d.y += d.v * dt; d.x += d.v * slant * dt;
        if (d.y > H + 20) { d.y = -20 - Math.random() * 40; d.x = Math.random() * (W + 120) - 120 * slant; }
        if (d.x > W + 20) d.x -= W + 60;
      }
      // lightning scheduling (frequency 0 = never)
      if (cfg.lightning > 0) {
        nextStrike -= dt;
        if (nextStrike <= 0) {
          bolt = makeBolt();
          const mean = 16 - cfg.lightning * 0.145; // 16s .. ~1.5s
          nextStrike = mean * (0.35 + Math.random() * 1.3);
        }
      }
      if (bolt) {
        bolt.age += dt;
        if (bolt.age > 2.5) bolt = null;
      }
      const target = bolt ? boltLight(bolt) : 0;
      flash = Math.max(target, flash * Math.exp(-dt / 0.25));
    }

    function render() {
      const d = B.d, c = cfg.cloud, bc = cfg.bolt;
      const rainK = cfg.rain / 100;
      const bxp = bolt ? bolt.x : 160;
      let o = 0;
      for (let j = 0; j < BH; j++) {
        const y = (j + 0.5) * SY;
        const top = 1 - j / BH;
        for (let i = 0; i < BW; i++, o += 4) {
          const x = (i + 0.5) * SX;
          // two rolling cloud decks at different speeds
          const n1 = 0.55 * vnoise((x + drift) * 0.012, y * 0.022 + t * 0.03) + 0.3 * vnoise((x + drift) * 0.027 + 7, y * 0.05 - t * 0.05) + 0.15 * vnoise((x + drift * 1.4) * 0.06, y * 0.09);
          const n2 = vnoise((x + drift * 0.55) * 0.008 + 31, y * 0.016 + 3);
          const dens = smooth(0.3, 0.75, n1 * 0.75 + n2 * 0.35) * (0.45 + 0.75 * top);
          // billowing underside lit faintly from below
          const shade = 0.16 + 0.5 * dens + 0.18 * smooth(0.55, 0.85, n1);
          // rain curtains sweeping through
          const sheet = rainK * (0.5 + 0.5 * Math.sin((x - y * 0.5) * 0.03 - t * 1.6 + 2 * n2)) * (0.3 + 0.7 * (1 - top));
          let R = 4 + c[0] * shade + 70 * sheet * 0.35;
          let G = 6 + c[1] * shade + 85 * sheet * 0.35;
          let Bl = 14 + c[2] * shade + 110 * sheet * 0.35;
          if (flash > 0.002) {
            const dx = (x - bxp) / 120;
            const lit = flash * (0.25 + 0.6 * Math.exp(-dx * dx)) * (0.4 + 0.8 * dens);
            R += bc[0] * lit; G += bc[1] * lit; Bl += bc[2] * lit;
          }
          d[o] = R; d[o + 1] = G; d[o + 2] = Bl; d[o + 3] = 255;
        }
      }
      present(B);

      // rain streaks
      const nDrops = Math.round(cfg.rain / 100 * MAXDROPS);
      const slant = 0.1 + cfg.wind / 100 * 0.45;
      ctx.lineCap = 'round';
      ctx.lineWidth = 1.6;
      const boost = 1 + flash * 1.5;
      for (let i = 0; i < nDrops; i++) {
        const dp = drops[i];
        ctx.strokeStyle = rgba([160 + flash * 80, 180 + flash * 60, 225], dp.a * boost);
        ctx.beginPath();
        ctx.moveTo(dp.x, dp.y);
        ctx.lineTo(dp.x - dp.l * slant, dp.y - dp.l);
        ctx.stroke();
      }

      // the bolt, with a lingering afterglow
      if (bolt) {
        const a = clamp(Math.max(boltLight(bolt), Math.exp(-bolt.age / 0.4) * 0.6), 0, 1);
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineJoin = 'round';
        const passes = [[20, 0.1], [9, 0.28], [3.2, 0.95]];
        for (const p of passes) {
          ctx.strokeStyle = p[0] < 4 ? rgba([bc[0] * 0.4 + 153, bc[1] * 0.4 + 153, bc[2] * 0.4 + 153], a * p[1]) : rgba(bc, a * p[1]);
          // one path per branch level so overlapping joints don't double up
          for (const lvl of LEVELS) {
            ctx.lineWidth = Math.max(0.6, p[0] * (0.35 + 0.65 * lvl));
            ctx.beginPath();
            let any = false;
            for (const s of bolt.segs) {
              if (s[4] !== lvl) continue;
              ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); any = true;
            }
            if (any) ctx.stroke();
          }
        }
        ctx.globalCompositeOperation = 'source-over';
      }
      // full-setup flash
      if (flash > 0.01) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = rgba(bc, clamp(flash * 0.3, 0, 0.45));
        ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
