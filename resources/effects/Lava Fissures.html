<head>
  <title>Lava Fissures</title>
  <meta description="A dark cooling lava crust split by glowing cracks that slowly shift, with molten surges flaring up through the seams." />
  <meta publisher="Lumora" />
  <meta category="Nature" />
  <meta energy="lively" />
  <meta palette="warm" />
  <meta tags="nature,lava,magma,volcano,cracks,fire,molten,heat,orange,red,glow,warm" />
  <meta property="heatColor" label="Heat Color" type="color" default="#ff4a00" />
  <meta property="crackDensity" label="Crack Density" type="number" min="0" max="100" default="45" />
  <meta property="activity" label="Activity" tooltip="Plate drift and how often surges flare" type="number" min="0" max="100" default="50" />
  <meta property="glow" label="Glow" type="number" min="1" max="100" default="65" />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden">
  <canvas id="c" width="320" height="200"></canvas>
  <script>
    'use strict';
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 320, H = 200;
    const get = (f, d) => { try { const v = f(); return v === undefined || v === null ? d : v; } catch (e) { return d; } };
    const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === '' || !isFinite(n) ? d : n; };
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const hexRgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); const n = parseInt(m ? m[1] : d.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    function buffer(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      const img = x.createImageData(w, h);
      return { c, x, img, d: img.data, w, h };
    }
    function present(b) {
      b.x.putImageData(b.img, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(b.c, 0, 0, W, H);
    }
    const PERM = new Uint8Array(512);
    (function () {
      const p = []; let s = 1618;
      for (let i = 0; i < 256; i++) p[i] = i;
      for (let i = 255; i > 0; i--) { s = (s * 16807) % 2147483647; const j = s % (i + 1); const tmp = p[i]; p[i] = p[j]; p[j] = tmp; }
      for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
    })();
    function vnoise(x, y) {
      let xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      xi &= 255; yi &= 255;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      const a = PERM[PERM[xi] + yi], b = PERM[PERM[xi + 1] + yi], c = PERM[PERM[xi] + yi + 1], d = PERM[PERM[xi + 1] + yi + 1];
      const top = a + (b - a) * u, bot = c + (d - c) * u;
      return (top + (bot - top) * v) / 255;
    }

    const BW = 96, BH = 60, SX = W / BW, SY = H / BH;
    const B = buffer(BW, BH);
    const MAXP = 46;
    const X0 = -50, X1 = W + 50, Y0 = -50, Y1 = H + 50;
    const plates = [];
    for (let i = 0; i < MAXP; i++) {
      const a = Math.random() * Math.PI * 2;
      plates.push({ x: X0 + Math.random() * (X1 - X0), y: Y0 + Math.random() * (Y1 - Y0), vx: Math.cos(a), vy: Math.sin(a), ph: Math.random() * 100 });
    }
    const surges = [];
    const cfg = { heat: [255, 74, 0], density: 45, activity: 50, glow: 65 };
    const LUT = new Uint8ClampedArray(256 * 3);
    let lutFor = '';
    let t = 0, nextSurge = 1.5;

    function buildLut() {
      const h = cfg.heat;
      // black crust -> deep ember -> chosen heat -> yellow -> white-hot
      const stops = [
        [0, 6, 2, 1],
        [0.18, h[0] * 0.18 + 14, h[1] * 0.06 + 2, h[2] * 0.05 + 1],
        [0.42, h[0] * 0.6, h[1] * 0.35, h[2] * 0.3],
        [0.62, h[0], h[1], h[2]],
        [0.82, h[0] * 0.5 + 128, h[1] * 0.5 + 100, h[2] * 0.4 + 20],
        [1, 255, 245, 200]
      ];
      for (let i = 0; i < 256; i++) {
        const p = i / 255;
        let k = 0;
        while (k < stops.length - 2 && p > stops[k + 1][0]) k++;
        const a = stops[k], b = stops[k + 1];
        const f = clamp((p - a[0]) / (b[0] - a[0]), 0, 1);
        LUT[i * 3] = a[1] + (b[1] - a[1]) * f;
        LUT[i * 3 + 1] = a[2] + (b[2] - a[2]) * f;
        LUT[i * 3 + 2] = a[3] + (b[3] - a[3]) * f;
      }
      lutFor = h.join(',');
    }

    function readProps() {
      cfg.heat = hexRgb(get(() => heatColor, '#ff4a00'), '#ff4a00');
      cfg.density = clamp(num(get(() => crackDensity), 45), 0, 100);
      cfg.activity = clamp(num(get(() => activity), 50), 0, 100);
      cfg.glow = clamp(num(get(() => glow), 65), 1, 100);
      if (lutFor !== cfg.heat.join(',')) buildLut();
    }
    function onheatColorChanged() { readProps(); }
    function oncrackDensityChanged() { readProps(); }
    function onactivityChanged() { readProps(); }
    function onglowChanged() { readProps(); }

    function plateCount() { return Math.round(10 + cfg.density / 100 * (MAXP - 10)); }

    function update(dt) {
      t += dt;
      if (t > 1e5) t = 0;
      const a = cfg.activity / 100;
      const sp = 1.5 + a * 9;
      const n = plateCount();
      for (let i = 0; i < n; i++) {
        const p = plates[i];
        // slow wandering drift
        const ang = Math.atan2(p.vy, p.vx) + dt * 0.3 * Math.sin(t * 0.2 + p.ph);
        p.vx = Math.cos(ang); p.vy = Math.sin(ang);
        p.x += p.vx * sp * dt; p.y += p.vy * sp * dt;
        if (p.x < X0) p.x += X1 - X0; else if (p.x > X1) p.x -= X1 - X0;
        if (p.y < Y0) p.y += Y1 - Y0; else if (p.y > Y1) p.y -= Y1 - Y0;
      }
      nextSurge -= dt * (0.2 + a * 1.6);
      if (nextSurge <= 0 && cfg.activity > 0) {
        surges.push({ x: 20 + Math.random() * (W - 40), y: 15 + Math.random() * (H - 30), age: 0, k: 0.7 + Math.random() * 0.5 });
        nextSurge = 2 + Math.random() * 4;
      }
      for (let i = surges.length - 1; i >= 0; i--) {
        surges[i].age += dt;
        if (surges[i].age > 5) surges.splice(i, 1);
      }
    }

    function render() {
      const d = B.d, n = plateCount();
      const gl = 0.55 + cfg.glow / 100 * 0.75;
      const cellPx = Math.sqrt((X1 - X0) * (Y1 - Y0) / n);
      const wBase = 3 + cellPx * 0.04;
      let o = 0;
      for (let j = 0; j < BH; j++) {
        const y = (j + 0.5) * SY;
        for (let i = 0; i < BW; i++, o += 4) {
          const x = (i + 0.5) * SX;
          // warp the lookup so the plate edges wander like real cracks
          const wx = x + 26 * (vnoise(x * 0.022 + 3.1, y * 0.022) - 0.5) + 8 * (vnoise(x * 0.07, y * 0.07 + 5) - 0.5);
          const wy = y + 26 * (vnoise(x * 0.022 + 11.7, y * 0.022 + 4.4) - 0.5) + 8 * (vnoise(x * 0.07 + 9, y * 0.07) - 0.5);
          // distance to nearest and second-nearest plate centre
          let f1 = 1e9, f2 = 1e9;
          for (let k = 0; k < n; k++) {
            const dx = wx - plates[k].x, dy = wy - plates[k].y;
            const dd = dx * dx + dy * dy;
            if (dd < f1) { f2 = f1; f1 = dd; } else if (dd < f2) f2 = dd;
          }
          const edge = Math.sqrt(f2) - Math.sqrt(f1);
          // molten flow pulsing along the seams
          const flow = vnoise(x * 0.025 + t * 0.15, y * 0.025 - t * 0.1);
          const flow2 = vnoise(x * 0.06 - t * 0.35, y * 0.06 + 7);
          const width = wBase * (0.6 + 0.9 * flow);
          let surge = 0;
          for (const s of surges) {
            const dx = x - s.x, dy = y - s.y, dist = Math.sqrt(dx * dx + dy * dy);
            const ring = dist - s.age * 70;
            const fade = Math.exp(-s.age / 1.6);
            surge += s.k * fade * (Math.exp(-ring * ring / 900) + 0.8 * Math.exp(-dist * dist / 2200));
          }
          const crack = Math.exp(-edge / (width * (1 + surge * 0.8)));
          let heat = crack * (0.5 + 0.3 * flow + 0.2 * flow2 + surge * 0.45);
          // residual warmth bleeding into the crust beside the cracks
          heat += 0.17 * Math.exp(-edge / (width * 5)) * (0.6 + 0.4 * flow);
          heat += surge * 0.12;
          // crust texture: subtly mottled, cooler towards the plate centres
          heat += 0.05 * vnoise(x * 0.09, y * 0.09) * (1 - crack);
          const li = clamp(heat * gl * 255, 0, 255) | 0;
          d[o] = LUT[li * 3]; d[o + 1] = LUT[li * 3 + 1]; d[o + 2] = LUT[li * 3 + 2]; d[o + 3] = 255;
        }
      }
      present(B);
    }

    let last = null;
    function frame(ts) {
      requestAnimationFrame(frame);
      const now = typeof ts === 'number' && isFinite(ts) ? ts : Date.now();
      const dt = last === null ? 1 / 60 : clamp((now - last) / 1000, 0, 0.1);
      last = now;
      readProps();
      update(dt);
      render();
    }
    readProps();
    requestAnimationFrame(frame);
  </script>
</body>
